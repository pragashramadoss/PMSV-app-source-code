android {
    namespace 'com.pmsvgroup.nativeapp'
    compileSdk 36
    defaultConfig {
        // Website installs retain their existing identity; Play updates the original listing.
        applicationId (project.name == 'play-app' ? 'com.pmsvgroup.foodsafety' : 'com.pmsvgroup.foodsafety.preview')
        minSdk 26
        targetSdk 36
        versionCode 13
        versionName '2.1.2'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    sourceSets {
        main {
            manifest.srcFile rootProject.file('native-app/src/main/AndroidManifest.xml')
            java.srcDirs = [rootProject.file('native-app/src/main/java')]
            res.srcDirs = [rootProject.file('native-app/src/main/res')]
            assets.srcDirs = [rootProject.file('native-app/src/main/assets')]
        }
        test.java.srcDirs = [rootProject.file('native-app/src/test/java')]
        androidTest.java.srcDirs = [rootProject.file('native-app/src/androidTest/java')]
    }
    buildFeatures { compose true; buildConfig true }
    buildTypes {
        // Disposable CI debug installs never share the distributed preview identity.
        debug { applicationIdSuffix '.debug' }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    packaging { resources.excludes += '/META-INF/{AL2.0,LGPL2.1}' }
}
dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2025.10.01')
    implementation composeBom
    androidTestImplementation composeBom
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.4'
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.work:work-runtime-ktx:2.10.5'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
