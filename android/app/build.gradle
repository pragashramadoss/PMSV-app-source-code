plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pmsvgroup.foodsafety'
    compileSdk 36

    defaultConfig {
        applicationId 'com.pmsvgroup.foodsafety'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.3'
}
