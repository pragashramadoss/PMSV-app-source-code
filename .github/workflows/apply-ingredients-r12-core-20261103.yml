name: Apply R12 ingredient source core corrections
on:
  push:
    branches: ['audit/all-533-2026-11-02']
    paths: ['.github/workflows/apply-ingredients-r12-core-20261103.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/audit/all-533-2026-11-02'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply preimage and output-hash checked corrections
        run: python3 scripts/apply_ingredients_r12_core_20261103.py
      - name: Commit only the three selected modules on the audit branch
        shell: bash
        run: |
          test "${GITHUB_REF}" = 'refs/heads/audit/all-533-2026-11-02'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fssai-product-helper-preview-01/data/rules/chapter-2-11-other-food-products-v1.json fssai-product-helper-preview-01/data/rules/chapter-2-16-hemp-v1.json fssai-product-helper-preview-01/data/rules/chapter-3-substances-added-v1.json
          git diff --cached --check
          git commit -m 'Preserve R12 ingredient subtype, sample-portion and unresolved-source boundaries'
          git push origin HEAD:refs/heads/audit/all-533-2026-11-02
      - uses: actions/upload-artifact@v4
        with:
          name: ingredients-r12-core-applied-20261103
          path: ingredients-r12-core-applied/
          retention-days: 3
          if-no-files-found: error
