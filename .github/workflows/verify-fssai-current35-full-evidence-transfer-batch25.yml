name: Verify FSSAI complete selected evidence transfer (Batch25)
on:
  push:
    branches: [gh-pages]
    paths:
      - 'fssai-product-helper-preview-01/fssai-current35-complete-evidence-transfer-batch25-2026-10-16.js'
      - 'tests/fssai-current35-complete-evidence-transfer-batch25-2026-10-16.test.cjs'
      - '.github/workflows/verify-fssai-current35-full-evidence-transfer-batch25.yml'
      - 'fssai-product-helper-preview-01/index.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  complete-evidence-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Chromium runner
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate JavaScript syntax
        run: node --check fssai-product-helper-preview-01/fssai-current35-complete-evidence-transfer-batch25-2026-10-16.js
      - name: Verify 35-case unverified complete evidence transfer in Chromium
        run: node tests/fssai-current35-complete-evidence-transfer-batch25-2026-10-16.test.cjs
