name: Verify current35 legal article source conflicts (Batch17)
on:
  push:
    branches: [gh-pages]
    paths:
      - 'fssai-product-helper-preview-01/data/rules/fssai-current35-legal-source-conflicts-batch17-2026-10-14.json'
      - 'fssai-product-helper-preview-01/fssai-current35-legal-source-conflicts-batch17-2026-10-14.js'
      - 'tests/fssai-current35-legal-source-conflicts-batch17-2026-10-14.test.cjs'
      - 'FSSAI-CURRENT35-BATCH17-COFFEE-OCHRATOXIN-ASH-CONTRADICTIONS-2026-10-14.md'
      - 'fssai-product-helper-preview-01/index.html'
      - '.github/workflows/verify-fssai-current35-source-conflicts-batch17.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact legal source boundaries and 35 pending guards
        run: node --test tests/fssai-current35-legal-source-conflicts-batch17-2026-10-14.test.cjs
      - name: Syntax check new browser module
        run: node --check fssai-product-helper-preview-01/fssai-current35-legal-source-conflicts-batch17-2026-10-14.js
