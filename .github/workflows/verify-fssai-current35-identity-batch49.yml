name: Verify FSSAI Batch49 ten original FSSR identity pages, 35 CTR holds
on:
  push:
    branches: [gh-pages]
    paths:
      - 'fssai-product-helper-preview-01/data/rules/fssai-current35-additional10-fssr-identity-batch49-2026-10-16.json'
      - 'fssai-product-helper-preview-01/fssai-current35-additional10-fssr-identity-batch49-2026-10-16.js'
      - 'tests/fssai-current35-additional10-fssr-identity-batch49-2026-10-16.test.cjs'
      - 'fssai-product-helper-preview-01/index.html'
      - '.github/workflows/verify-fssai-current35-identity-batch49.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-identity-regulatory-holds:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate new JS source
        run: node --check fssai-product-helper-preview-01/fssai-current35-additional10-fssr-identity-batch49-2026-10-16.js
      - name: Verify 10 source pages, 35 pending and CSV in real browser
        run: node tests/fssai-current35-additional10-fssr-identity-batch49-2026-10-16.test.cjs
