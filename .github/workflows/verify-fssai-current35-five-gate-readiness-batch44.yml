name: Verify FSSAI 35-case five-gate documentary readiness (Batch44)
on:
  push:
    branches: [gh-pages]
    paths:
      - 'fssai-product-helper-preview-01/data/rules/fssai-current35-five-gate-readiness-batch44-2026-10-16.json'
      - 'fssai-product-helper-preview-01/fssai-current35-five-gate-readiness-batch44-2026-10-16.js'
      - 'tests/fssai-current35-five-gate-readiness-batch44-2026-10-16.test.cjs'
      - 'fssai-product-helper-preview-01/index.html'
      - '.github/workflows/verify-fssai-current35-five-gate-readiness-batch44.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-five-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check Batch44 JavaScript syntax
        run: node --check fssai-product-helper-preview-01/fssai-current35-five-gate-readiness-batch44-2026-10-16.js
      - name: Verify 35 pending cases and 175 unsent evidence gates in Chromium
        run: node tests/fssai-current35-five-gate-readiness-batch44-2026-10-16.test.cjs
