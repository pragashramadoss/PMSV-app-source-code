name: Verify current FSSAI first-source ledger (fast)
on:
  push:
    branches: [gh-pages]
    paths:
      - 'fssai-product-helper-preview-01/fssai-first-source-current-*.js'
      - 'fssai-product-helper-preview-01/fssai-source-proof-panels.js'
      - 'fssai-product-helper-preview-01/fssai-evidence-capture-116.js'
      - 'scripts/audit-fssai-current-89-ui-regression.cjs'
      - 'fssai-product-helper-preview-01/data/rules/fssai-current-*-first-exact-source-proof-worklist-2026-10-12.json'
      - 'fssai-product-helper-preview-01/data/rules/fssai-current-first-source-533-live-ledger-*.json'
      - 'fssai-product-helper-preview-01/data/rules/fssai-five-exact-conditional-finished-subroute-2026-10-12.json'
      - 'fssai-product-helper-preview-01/data/rules/fssai-nine-mushroom-containing-exact-named-subroutes-2026-10-12.json'
      - 'fssai-product-helper-preview-01/data/rules/fssai-fat-spread-nickel-first-source-2026-10-12.json'
      - 'fssai-product-helper-preview-01/data/rules/fssai-four-sugar-high-ash-conditional-source-2026-10-12.json'
      - 'fssai-product-helper-preview-01/data/rules/fssai-two-whole-egg-shell-free-residue-2026-10-12.json'
      - 'fssai-product-helper-preview-01/data/rules/contaminants-2026-deferred-amendment-v1.json'
      - 'fssai-product-helper-preview-01/data/rules/fssai-2026-may-gazette-533-effective-date-controls-2026-10-12.json'
      - 'fssai-product-helper-preview-01/data/rules/fssai-89-current-exact-finished-article-evidence-packets-2026-10-12.json'
      - 'fssai-product-helper-preview-01/data/rules/fssai-89-detailed-finished-identity-audit-2026-10-12.json'
      - 'fssai-product-helper-preview-01/data/rules/fssai-91-remaining-sugar-ash-evidence-decisions-2026-10-12.json'
      - 'fssai-product-helper-preview-01/data/rules/fssai-95-current-pending-finished-food-evidence-dossiers-2026-10-12.json'
      - 'fssai-product-helper-preview-01/index.html'
      - 'tests/fssai-first-source-current-*.test.cjs'
      - '.github/workflows/verify-fssai-current-first-source-fast.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax of latest ledgers
        run: |
          node --check fssai-product-helper-preview-01/fssai-first-source-current-428-105.js
          node --check fssai-product-helper-preview-01/fssai-first-source-current-437-96.js
          node --check fssai-product-helper-preview-01/fssai-first-source-current-438-95.js
          node --check fssai-product-helper-preview-01/fssai-first-source-current-442-91.js
          node --check fssai-product-helper-preview-01/fssai-first-source-current-444-89.js
          node --check fssai-product-helper-preview-01/fssai-2026-may-533-89-effective-date.js
      - name: Verify 89 pending and 27 archived-to-partial UI transitions
        run: |
          node --check fssai-product-helper-preview-01/fssai-source-proof-panels.js
          node --check fssai-product-helper-preview-01/fssai-evidence-capture-116.js
          node scripts/audit-fssai-current-89-ui-regression.cjs
      - name: Verify 423, 428 and 437 source-ledger integrity, disjoint IDs and fail-closed controls
        run: |
          node --test tests/fssai-first-source-current-423-110-2026-10-12.test.cjs
          node --test tests/fssai-first-source-current-428-105-2026-10-12.test.cjs
          node --test tests/fssai-first-source-current-437-96-2026-10-12.test.cjs
          node --test tests/fssai-first-source-current-438-95-2026-10-12.test.cjs
          node --test tests/fssai-first-source-current-442-91-2026-10-12.test.cjs
          node --test tests/fssai-first-source-current-444-89-2026-10-12.test.cjs
          node --test tests/fssai-2026-may-533-89-effective-date-2026-10-12.test.cjs
