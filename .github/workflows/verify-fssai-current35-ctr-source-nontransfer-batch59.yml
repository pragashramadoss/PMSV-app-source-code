name: Verify FSSAI Batch59 exact CTR source non-transfer
on:
  push:
    branches: [gh-pages]
    paths:
      - 'fssai-product-helper-preview-01/data/rules/fssai-current35-reference-row-nontransfer-batch59-2026-10-17.json'
      - 'fssai-product-helper-preview-01/fssai-current35-reference-row-nontransfer-batch59-2026-10-17.js'
      - 'tests/fssai-current35-source-comparator-nontransfer-batch59-2026-10-17.test.cjs'
      - 'FSSAI-CURRENT35-BATCH59-SOURCE-ROW-NONTRANSFER-2026-10-17.md'
      - 'fssai-product-helper-preview-01/index.html'
      - '.github/workflows/verify-fssai-current35-ctr-source-nontransfer-batch59.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-batch59:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check Batch59 UI syntax
        run: node --check fssai-product-helper-preview-01/fssai-current35-reference-row-nontransfer-batch59-2026-10-17.js
      - name: Verify 35 held cases, 15 nontransfer reference rows and 20 pending cases
        run: node tests/fssai-current35-source-comparator-nontransfer-batch59-2026-10-17.test.cjs
