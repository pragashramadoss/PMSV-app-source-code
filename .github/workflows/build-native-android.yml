name: Build and test native PMSV Android
on:
  push:
    branches: ['native/**']
    paths: ['android/**', '.github/workflows/build-native-android.yml']
  pull_request:
    branches: [android-playstore]
    paths: ['android/**', '.github/workflows/build-native-android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-android-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  native:
    # Same-repository native branches are already checked by the push run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'native/')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build native APK and run checks
        working-directory: android
        run: gradle --no-daemon :native-app:assembleDebug :native-app:assembleRelease :native-app:testDebugUnitTest :native-app:lint :native-app:assembleDebugAndroidTest
      - name: Verify native package has no TWA launcher
        run: |
          APK=android/native-app/build/outputs/apk/debug/native-app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > /tmp/native-badging.txt
          grep -q "name='com.pmsvgroup.foodsafety.preview.debug'" /tmp/native-badging.txt
          grep -q 'com.pmsvgroup.nativeapp.MainActivity' /tmp/native-badging.txt
          ! grep -q 'PmsvLauncherActivity' /tmp/native-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android/native-app/build/outputs/apk/release/native-app-release-unsigned.apk > /tmp/release-badging.txt
          grep -q "name='com.pmsvgroup.foodsafety.preview'" /tmp/release-badging.txt
          ! grep -q 'application-debuggable' /tmp/release-badging.txt
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test native screens on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash android/run-native-emulator-tests.sh
      - name: Package native preview
        if: success()
        run: |
          mkdir -p native-release
          cp android/native-app/build/outputs/apk/release/native-app-release-unsigned.apk native-release/PMSV-Preview-2.0.3-unsigned.apk
          cp android/NATIVE-README.md native-release/README.md
          cp -R native-qa native-release/
          sha256sum native-release/PMSV-Preview-2.0.3-unsigned.apk > native-release/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PMSV-Native-Preview-and-Test-Results
          path: |
            native-release/
            native-qa/
            android/native-app/build/reports/
            android/native-app/build/outputs/androidTest-results/
          retention-days: 30
