name: Verify PMSV Batch104 responsive independent evidence-review loading
on:
  push:
    branches: [gh-pages]
    paths:
      - 'fssai-product-helper-preview-01/pmsv-batch98-source-authentication-handoff-2026-10-25.js'
      - 'fssai-product-helper-preview-01/pmsv-batch99-downstream-evidence-dependency-audit-2026-10-25.js'
      - 'fssai-product-helper-preview-01/pmsv-batch100-independent-review-exception-register-2026-10-25.js'
      - 'tests/pmsv-batch104-event-dispatch-yield.test.cjs'
      - '.github/workflows/verify-pmsv-batch104-event-dispatch-yield.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-responsive-evidence-loading:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Click-handler yielding, duplicate suppression and invalid-source hold
        run: node tests/pmsv-batch104-event-dispatch-yield.test.cjs
      - name: Warm and cold independent reviewer handoff
        run: node tests/pmsv-batch103-verified-handoff.test.cjs
      - name: Full source-gate tamper, revised document and exception histories
        run: |
          node tests/pmsv-batch102-single-pass-evidence-guards.test.cjs
          node tests/pmsv-batch101-reviewer-navigation.test.cjs
          node tests/pmsv-batch100-reviewer-exceptions.test.cjs
          node tests/pmsv-batch99-downstream-audit.test.cjs
          node tests/pmsv-batch98-source-handoff.test.cjs
