name: Verify PMSV FSSAI source review in real Chromium (Batch22)
on:
  push:
    branches: [gh-pages]
    paths:
      - 'fssai-product-helper-preview-01/fssai-current35-browser-review-integrity-batch22-2026-10-14.js'
      - 'tests/fssai-current35-browser-review-integrity-batch22-2026-10-14.test.cjs'
      - 'fssai-product-helper-preview-01/index.html'
      - '.github/workflows/verify-fssai-current35-browser-integrity-batch22.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ephemeral browser for test
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check Batch22 JavaScript
        run: node --check 'fssai-product-helper-preview-01/fssai-current35-browser-review-integrity-batch22-2026-10-14.js'
      - name: Run actual PMSV B14-B22 evidence workflow in Chromium
        run: node 'tests/fssai-current35-browser-review-integrity-batch22-2026-10-14.test.cjs'
