name: Verify nine PMSV FSSAI source routes (Batch35)
on:
  push:
    branches: [gh-pages]
    paths:
      - 'fssai-product-helper-preview-01/data/rules/fssai-current35-nine-source-adjudications-batch35-2026-10-16.json'
      - 'fssai-product-helper-preview-01/fssai-current35-nine-source-adjudications-batch35-2026-10-16.js'
      - 'tests/fssai-current35-nine-source-adjudications-batch35-2026-10-16.test.cjs'
      - 'fssai-product-helper-preview-01/index.html'
      - '.github/workflows/verify-fssai-current35-nine-source-routes-batch35.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-nine-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium browser test
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify JavaScript syntax
        run: node --check fssai-product-helper-preview-01/fssai-current35-nine-source-adjudications-batch35-2026-10-16.js
      - name: Validate official source evidence and real browser panel
        run: node tests/fssai-current35-nine-source-adjudications-batch35-2026-10-16.test.cjs
