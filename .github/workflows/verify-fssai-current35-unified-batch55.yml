name: Verify FSSAI Batch55 unified 35-case and 175-gate closure tracker
on:
  push:
    branches: [gh-pages]
    paths:
      - 'fssai-product-helper-preview-01/data/rules/fssai-current35-unified-owner-closure-tracker-batch55-2026-10-16.json'
      - 'fssai-product-helper-preview-01/fssai-current35-unified-owner-closure-tracker-batch55-2026-10-16.js'
      - 'tests/fssai-current35-unified-closure-batch55-2026-10-16.test.cjs'
      - 'fssai-product-helper-preview-01/index.html'
      - 'FSSAI-CURRENT35-BATCH55-UNIFIED-175-GATE-OWNER-PLAN-2026-10-16.md'
      - '.github/workflows/verify-fssai-current35-unified-batch55.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-batch55:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Syntax-check Batch55 tracker script
        run: node --check fssai-product-helper-preview-01/fssai-current35-unified-owner-closure-tracker-batch55-2026-10-16.js
      - name: Verify immutable 35/175 lineage, five owner queues, memory-only drafts and CSV exports
        run: node tests/fssai-current35-unified-closure-batch55-2026-10-16.test.cjs
