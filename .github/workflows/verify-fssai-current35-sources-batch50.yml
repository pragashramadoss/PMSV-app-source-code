name: Verify FSSAI Batch50 eleven pending primary-source case classifications
on:
  push:
    branches: [gh-pages]
    paths:
      - 'fssai-product-helper-preview-01/data/rules/fssai-current35-final11-identity-source-router-batch50-2026-10-16.json'
      - 'fssai-product-helper-preview-01/fssai-current35-final11-identity-source-router-batch50-2026-10-16.js'
      - 'tests/fssai-current35-final11-identity-source-router-batch50-2026-10-16.test.cjs'
      - 'fssai-product-helper-preview-01/index.html'
      - 'FSSAI-CURRENT35-BATCH50-ELEVEN-PRIMARY-SOURCE-ROUTES-2026-10-16.md'
      - '.github/workflows/verify-fssai-current35-sources-batch50.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-batch50:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: JavaScript syntax
        run: node --check fssai-product-helper-preview-01/fssai-current35-final11-identity-source-router-batch50-2026-10-16.js
      - name: Validate all eleven source routings in headless Chromium
        run: node tests/fssai-current35-final11-identity-source-router-batch50-2026-10-16.test.cjs
