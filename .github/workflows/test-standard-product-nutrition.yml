name: Validate PMSV standardized-product nutrition

on:
  push:
    branches: [gh-pages]
    paths:
      - 'fssai-product-helper-preview-01/index.html'
      - 'tests/standard-product-nutrition-v477.test.cjs'
      - 'tests/fssai-dairy-composition-v481.test.cjs'
      - 'tests/fssai-standard-key-scope-v482.test.cjs'
      - 'tests/fssai-product-additive-restrictions.test.cjs'
      - 'tests/fssai-contaminants-direct-microbiology.test.cjs'
      - 'tests/fssai-ingredient-contaminant-source-gates.test.cjs'
      - 'tests/fssai-chapter-2-8-direct-beeswax-lead.test.cjs'
      - 'tests/fssai-chapter-2-10-water-fluoride.test.cjs'
      - 'tests/fssai-chapter-2-7-contaminant-lock.test.cjs'
      - 'tests/fssai-chapter-2-5-meat-egg-residue-review.test.cjs'
      - 'tests/fssai-chapter-2-4-commodity-residue-review.test.cjs'
      - 'tests/fssai-ragi-grain-v483.test.cjs'
      - 'tests/fssai-pulse-grain-v488.test.cjs'
      - 'tests/fssai-catalogue-audit-v485.test.cjs'
      - '.github/workflows/test-standard-product-nutrition.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nutrition-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source JavaScript and standardized-product nutrition behavior
        run: node --test tests/standard-product-nutrition-v477.test.cjs tests/fssai-dairy-composition-v481.test.cjs tests/fssai-standard-key-scope-v482.test.cjs tests/fssai-product-additive-restrictions.test.cjs tests/fssai-contaminants-direct-microbiology.test.cjs tests/fssai-ingredient-contaminant-source-gates.test.cjs tests/fssai-chapter-2-8-direct-beeswax-lead.test.cjs tests/fssai-chapter-2-10-water-fluoride.test.cjs tests/fssai-chapter-2-7-contaminant-lock.test.cjs tests/fssai-chapter-2-5-meat-egg-residue-review.test.cjs tests/fssai-chapter-2-4-commodity-residue-review.test.cjs tests/fssai-ragi-grain-v483.test.cjs tests/fssai-catalogue-audit-v485.test.cjs tests/fssai-pulse-grain-v488.test.cjs
