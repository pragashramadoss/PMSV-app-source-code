name: Apply R11 alcohol source core corrections
on:
  push:
    branches: ['audit/all-533-2026-11-02']
    paths: ['.github/workflows/apply-alcohol-r11-core-20261103.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/audit/all-533-2026-11-02'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply preimage and output-hash checked corrections
        run: python3 scripts/apply_alcohol_r11_core_20261103.py
      - name: Commit only the selected alcohol module on audit branch
        shell: bash
        run: |
          test "${GITHUB_REF}" = 'refs/heads/audit/all-533-2026-11-02'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fssai-product-helper-preview-01/data/rules/alcoholic-beverages-v5.json
          git diff --cached --check
          git commit -m 'Reconcile R11 alcohol date scope, exact boundaries and selected source issues'
          git push origin HEAD:refs/heads/audit/all-533-2026-11-02
      - uses: actions/upload-artifact@v4
        with:
          name: alcohol-r11-core-applied-20261103
          path: alcohol-r11-core-applied/
          retention-days: 3
          if-no-files-found: error
