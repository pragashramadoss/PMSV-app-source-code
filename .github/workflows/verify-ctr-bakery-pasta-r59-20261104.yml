name: PMSV R59 five bakery and pasta FSSR CTR source checks
on:
  push:
    branches:
      - audit/all-533-2026-11-02
    paths:
      - 'fssai-helper/ctr-bakery-pasta-five-source-review-r59-2026-11-04.json'
      - 'fssai-helper/ctr-bakery-pasta-source-gate-r59-20261104.mjs'
      - 'scripts/test_ctr_bakery_pasta_r59_20261104.mjs'
      - '.github/workflows/verify-ctr-bakery-pasta-r59-20261104.yml'
  pull_request:
    branches:
      - gh-pages
    paths:
      - 'fssai-helper/ctr-bakery-pasta-five-source-review-r59-2026-11-04.json'
      - 'fssai-helper/ctr-bakery-pasta-source-gate-r59-20261104.mjs'
      - 'scripts/test_ctr_bakery_pasta_r59_20261104.mjs'
  workflow_dispatch:
jobs:
  check-original-five-source-cases:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate FSSR clauses, 2021 limits, CTR distinctions and no product PASS
        run: node scripts/test_ctr_bakery_pasta_r59_20261104.mjs
