name: Verify PMSV Batch84 23 official CTR article comparisons
on:
  push:
    branches: [gh-pages]
    paths:
      - 'fssai-product-helper-preview-01/fssai-final35-legal-review-2026-10-18.js'
      - 'tests/pmsv-batch84-23-official-named-article-comparators.test.cjs'
      - '.github/workflows/verify-pmsv-batch84-official-23-comparators.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-23:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JS syntax and all 23 numeric reference exclusions
        run: |
          node --check fssai-product-helper-preview-01/fssai-final35-legal-review-2026-10-18.js
          node tests/pmsv-batch84-23-official-named-article-comparators.test.cjs
          node tests/pmsv-public-source-review-completion.test.cjs
