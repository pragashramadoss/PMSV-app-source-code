name: Verify FSSAI 35 lab preflight guidance (Batch45)
on:
  push:
    branches: [gh-pages]
    paths:
      - 'fssai-product-helper-preview-01/data/rules/fssai-current35-lab-preflight-batch45-2026-10-16.json'
      - 'fssai-product-helper-preview-01/fssai-current35-lab-preflight-batch45-2026-10-16.js'
      - 'tests/fssai-current35-lab-preflight-batch45-2026-10-16.test.cjs'
      - 'fssai-product-helper-preview-01/index.html'
      - '.github/workflows/verify-fssai-current35-lab-preflight-batch45.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lab-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node --check fssai-product-helper-preview-01/fssai-current35-lab-preflight-batch45-2026-10-16.js
      - run: node tests/fssai-current35-lab-preflight-batch45-2026-10-16.test.cjs
