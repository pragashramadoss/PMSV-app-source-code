name: Apply R16 contaminant source-article review
on:
  push:
    branches: ['audit/all-533-2026-11-02']
    paths: ['.github/workflows/apply-contaminants-r16-20261103.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/audit/all-533-2026-11-02'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply R16 exact preimage and exact expected output metadata only
        run: python3 scripts/apply_contaminants_r16_20261103.py
      - name: Commit only scoped audit metadata
        shell: bash
        run: |
          test "$GITHUB_REF" = 'refs/heads/audit/all-533-2026-11-02'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fssai-product-helper-preview-01/data/rules/contaminants-v9-core.json
          git diff --cached --check
          git commit -m 'Record R16 universal and conditional contaminant article applicability'
          git push origin HEAD:refs/heads/audit/all-533-2026-11-02
      - uses: actions/upload-artifact@v4
        with:
          name: contaminants-r16-core-applied-20261103
          path: contaminants-r16-core-applied/
          retention-days: 3
          if-no-files-found: error
