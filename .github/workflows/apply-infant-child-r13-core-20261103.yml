name: Apply R13 infant child source core corrections
on:
  push:
    branches: ['audit/all-533-2026-11-02']
    paths: ['.github/workflows/apply-infant-child-r13-core-20261103.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/audit/all-533-2026-11-02'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply preimage and exact-output-hash checked corrections
        run: python3 scripts/apply_infant_child_r13_core_20261103.py
      - name: Commit only selected tested core files
        shell: bash
        run: |
          test "${GITHUB_REF}" = 'refs/heads/audit/all-533-2026-11-02'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fssai-product-helper-preview-01/data/rules/foods-for-infant-nutrition-v2.json fssai-product-helper-preview-01/data/rules/chapter-2-4-cereals-v1.json fssai-product-helper-preview-01/data/product-master-v1.json
          git diff --cached --check
          git commit -m 'Reconcile R13 infant trace nutrients and child supplement requirements'
          git push origin HEAD:refs/heads/audit/all-533-2026-11-02
      - uses: actions/upload-artifact@v4
        with:
          name: infant-child-r13-core-applied-20261103
          path: infant-child-r13-core-applied/
          retention-days: 3
          if-no-files-found: error
