name: Verify current FSSAI 35 positive FSSR-CTR boundaries Batch 12
on:
  push:
    branches: [gh-pages]
    paths:
      - 'fssai-product-helper-preview-01/data/rules/fssai-current35-positive-fssr-ctr-boundaries-batch12-2026-10-13.json'
      - 'fssai-product-helper-preview-01/fssai-current35-positive-fssr-ctr-boundaries-batch12-2026-10-13.js'
      - 'tests/fssai-current35-positive-fssr-ctr-boundaries-batch12-2026-10-13.test.cjs'
      - '.github/workflows/verify-fssai-current35-positive-fssr-ctr-boundaries-batch12.yml'
      - 'fssai-product-helper-preview-01/index.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/fssai-current35-positive-fssr-ctr-boundaries-batch12-2026-10-13.test.cjs
      - run: node --check fssai-product-helper-preview-01/fssai-current35-positive-fssr-ctr-boundaries-batch12-2026-10-13.js
