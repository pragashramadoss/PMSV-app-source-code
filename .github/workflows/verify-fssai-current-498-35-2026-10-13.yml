name: Verify FSSAI 498/35 cube sugar source and pending 35 evidence
on:
  push:
    branches: [gh-pages]
    paths:
      - 'fssai-product-helper-preview-01/fssai-current-first-source-498-35.js'
      - 'fssai-product-helper-preview-01/data/rules/fssai-cube-sugar-refined-chromium-conditional-2026-10-13.json'
      - 'fssai-product-helper-preview-01/data/rules/fssai-current-first-source-533-live-ledger-498-35-2026-10-13.json'
      - 'fssai-product-helper-preview-01/data/rules/fssai-current-35-first-exact-source-proof-worklist-2026-10-13.json'
      - 'fssai-product-helper-preview-01/data/rules/fssai-current-35-decisive-source-open-cases-2026-10-13.json'
      - 'tests/fssai-current-498-35-cube-sugar-official-source-2026-10-13.test.cjs'
      - 'fssai-product-helper-preview-01/index.html'
      - '.github/workflows/verify-fssai-current-498-35-2026-10-13.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check fssai-product-helper-preview-01/fssai-current-first-source-498-35.js
      - run: node --test tests/fssai-current-498-35-cube-sugar-official-source-2026-10-13.test.cjs
