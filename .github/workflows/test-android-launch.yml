name: Test PMSV Android Launch

on:
  push:
    branches: [android-playstore]
    paths:
      - 'android/**'
      - '.github/workflows/test-android-launch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-launch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch-test on Android emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            test -s "$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk"
            adb install -r "$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk"
            adb logcat -c
            adb shell am start -W -n com.pmsvgroup.foodsafety/com.google.androidbrowserhelper.trusted.LauncherActivity
            sleep 8
            adb logcat -d > /tmp/pmsv-logcat.txt
            grep -q "Process: com.pmsvgroup.foodsafety" /tmp/pmsv-logcat.txt && grep -q "FATAL EXCEPTION" /tmp/pmsv-logcat.txt && exit 1 || true
            adb shell am start -W -a android.intent.action.VIEW -d "https://pmsvgroup.com/"
            sleep 5
            adb logcat -d > /tmp/pmsv-deeplink-logcat.txt
            grep -q "Process: com.pmsvgroup.foodsafety" /tmp/pmsv-deeplink-logcat.txt && grep -q "FATAL EXCEPTION" /tmp/pmsv-deeplink-logcat.txt && exit 1 || true
            adb shell dumpsys package com.pmsvgroup.foodsafety | grep "versionCode=2"
            adb shell dumpsys package com.pmsvgroup.foodsafety | grep "versionName=1.0.1"
