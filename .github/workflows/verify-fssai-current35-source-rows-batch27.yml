name: Verify exact FSSAI CTR statutory source rows (Batch27)
on:
  push:
    branches: [gh-pages]
    paths:
      - 'fssai-product-helper-preview-01/data/rules/fssai-current35-source-row-proof-register-batch27-2026-10-16.json'
      - 'fssai-product-helper-preview-01/fssai-current35-source-row-proof-register-batch27-2026-10-16.js'
      - 'fssai-product-helper-preview-01/data/rules/fssai-current35-exact-article-adjudication-batch26-2026-10-16.json'
      - 'fssai-product-helper-preview-01/fssai-current35-exact-article-adjudication-batch26-2026-10-16.js'
      - 'tests/fssai-current35-source-row-proof-register-batch27-2026-10-16.test.cjs'
      - '.github/workflows/verify-fssai-current35-source-rows-batch27.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  statutory-rows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Batch27 application syntax
        run: node --check fssai-product-helper-preview-01/fssai-current35-source-row-proof-register-batch27-2026-10-16.js
      - name: Validate CTR article rows and unchanged ledger
        run: node tests/fssai-current35-source-row-proof-register-batch27-2026-10-16.test.cjs
