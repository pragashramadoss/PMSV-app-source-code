name: Verify PMSV Batch115 shipped exact-content WeakMap digest
on:
  push:
    branches: [gh-pages]
    paths:
      - 'fssai-product-helper-preview-01/fssai-source-proof-panels.js'
      - 'tests/pmsv-batch115-weakmap-digest-contract.test.cjs'
      - '.github/workflows/verify-pmsv-batch115-weakmap-digest.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  digest-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify full serialized-content memo safety and unchanged source fingerprints
        run: |
          node --check fssai-product-helper-preview-01/fssai-source-proof-panels.js
          node --test tests/pmsv-batch115-weakmap-digest-contract.test.cjs
          node --test tests/pmsv-batch110-snapshot-string-cache.test.cjs
          node --test tests/fssai-current-111-decision-gates-2026-10-12.test.cjs
          node --test tests/fssai-live-111-official-article-crosswalk-2026-10-12.test.cjs
