name: Verify current 35 FSSAI method scope exceptions (Batch39)
on:
  push:
    branches: [gh-pages]
    paths:
      - 'fssai-product-helper-preview-01/data/rules/fssai-current35-method-scope-exceptions-batch39-2026-10-16.json'
      - 'fssai-product-helper-preview-01/fssai-current35-method-scope-exceptions-batch39-2026-10-16.js'
      - 'tests/fssai-current35-method-scope-exceptions-batch39-2026-10-16.test.cjs'
      - 'fssai-product-helper-preview-01/index.html'
      - '.github/workflows/verify-fssai-current35-method-scope-exceptions-batch39.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-b39:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check preview script syntax
        run: node --check fssai-product-helper-preview-01/fssai-current35-method-scope-exceptions-batch39-2026-10-16.js
      - name: Verify official method applicability and Chromium preview
        run: node tests/fssai-current35-method-scope-exceptions-batch39-2026-10-16.test.cjs
