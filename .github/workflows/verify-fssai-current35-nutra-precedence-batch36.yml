name: Verify FSSAI Nutra operative source precedence (Batch36)
on:
  push:
    branches: [gh-pages]
    paths:
      - 'fssai-product-helper-preview-01/data/rules/fssai-current35-operative-precedence-batch36-2026-10-16.json'
      - 'fssai-product-helper-preview-01/fssai-current35-operative-precedence-batch36-2026-10-16.js'
      - 'tests/fssai-current35-nutra-operative-precedence-batch36-2026-10-16.test.cjs'
      - 'fssai-product-helper-preview-01/index.html'
      - '.github/workflows/verify-fssai-current35-nutra-precedence-batch36.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-nutra-precedence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium integration test
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify Batch36 client JavaScript syntax
        run: node --check fssai-product-helper-preview-01/fssai-current35-operative-precedence-batch36-2026-10-16.js
      - name: Verify original legal instruments and real browser crosswalk
        run: node tests/fssai-current35-nutra-operative-precedence-batch36-2026-10-16.test.cjs
