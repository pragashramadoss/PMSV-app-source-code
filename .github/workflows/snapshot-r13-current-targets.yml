name: Snapshot R13 current target files
on:
  push:
    branches: ['audit/all-533-2026-11-02']
    paths: ['.github/workflows/snapshot-r13-current-targets.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: r13-current-targets
          retention-days: 3
          path: |
            fssai-product-helper-preview-01/data/rules/chapter-2-4-cereals-v1.json
            fssai-product-helper-preview-01/data/rules/foods-for-infant-nutrition-v2.json
            fssai-product-helper-preview-01/data/rules/appendix-b-v2-core.json
            fssai-product-helper-preview-01/data/product-master-v1.json
