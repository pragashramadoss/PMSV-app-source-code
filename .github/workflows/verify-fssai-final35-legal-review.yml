name: Verify FSSAI final35 legal review
on:
  push:
    branches: [gh-pages]
    paths:
      - 'fssai-product-helper-preview-01/fssai-final35-legal-review-2026-10-18.js'
      - 'fssai-product-helper-preview-01/data/rules/fssai-final35-legal-candidate-audit-2026-10-17.json'
      - 'fssai-product-helper-preview-01/index.html'
      - 'tests/fssai-final35-legal-review.test.cjs'
      - 'tests/fssai-final35-real-preview.test.cjs'
      - '.github/workflows/verify-fssai-final35-legal-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check JavaScript
        run: |
          node --check fssai-product-helper-preview-01/fssai-final35-legal-review-2026-10-18.js
          node --check tests/fssai-final35-legal-review.test.cjs
          node --check tests/fssai-final35-real-preview.test.cjs
      - name: Test complete 35-product register
        run: node tests/fssai-final35-legal-review.test.cjs
      - name: Test real mobile PMSV application and 35-source research
        run: node tests/fssai-final35-real-preview.test.cjs
      - name: Test original 35-case source inventory
        run: node tests/fssai-current35-batch69-all35-source-coverage.test.cjs
