name: Sync PMSV stable preview

on:
  push:
    branches: [gh-pages]
    paths:
      - '.github/workflows/deploy-stable-preview.yml'
      - '.preview-trigger'

permissions:
  contents: write

concurrency:
  group: pmsv-pages-preview-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest WordPress production source
        uses: actions/checkout@v4
        with:
          ref: wordpress-production
          fetch-depth: 0

      - name: Assemble standalone preview
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pmsv-preview
          mkdir -p /tmp/pmsv-preview

          cp -R wordpress/plugin/assets/. /tmp/pmsv-preview/
          cp -R wordpress/plugin/public/. /tmp/pmsv-preview/
          cp wordpress/plugin/archive-seed.json /tmp/pmsv-preview/preview-news.json

          find /tmp/pmsv-preview/assets -type f -name '*.js' -print0 | xargs -0 sed -i             's#/wp-content/plugins/pmsv-original-app-preview/public/#/PMSV-app-source-code/#g'

          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/pmsv-preview/index.html')
          html = p.read_text()
          bootstrap = r"""
          <script>
          window.PMSV={base:'/PMSV-app-source-code',publicBase:'/PMSV-app-source-code/',preview:true};
          const __pmsvFetch=window.fetch.bind(window);
          window.fetch=async function(input,init){
            const raw=typeof input==='string'?input:(input&&input.url)||'';
            const url=new URL(raw,location.href);
            if(url.pathname==='/PMSV-app-source-code/api/news'){
              const r=await __pmsvFetch('/PMSV-app-source-code/preview-news.json',{cache:'no-store'});
              const news=await r.json();
              return new Response(JSON.stringify({news}),{status:200,headers:{'Content-Type':'application/json'}});
            }
            if(url.pathname==='/PMSV-app-source-code/api/updater'){
              return new Response(JSON.stringify({active:false,checkedAt:'',scheduleEnabled:false,coverage:'Standalone preview'}),{status:200,headers:{'Content-Type':'application/json'}});
            }
            if(url.pathname.startsWith('/PMSV-app-source-code/api/')){
              return new Response(JSON.stringify({error:'Unavailable in standalone preview'}),{status:404,headers:{'Content-Type':'application/json'}});
            }
            return __pmsvFetch(input,init);
          };
          </script>
          """
          html = html.replace('</head>', bootstrap + '</head>')
          p.write_text(html)
          Path('/tmp/pmsv-preview/404.html').write_text(html)
          Path('/tmp/pmsv-preview/.nojekyll').touch()
          PY

      - name: Sync preview into gh-pages branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git switch -C gh-pages origin/gh-pages

          # Replace only the standalone main-app preview artifacts. Preserve
          # GitHub-maintained tools (FSSAI Helper, audits, tests, evidence)
          # which are NOT generated from the WordPress production plugin.
          # Fail closed if the generated preview would overwrite these tools.
          for item in /tmp/pmsv-preview/*; do
            [ -e "$item" ] || continue
            name="${item##*/}"
            case "$name" in
              fssai-*|audits|tests)
                echo "Refusing to overwrite GitHub-managed tool directory: $name" >&2
                exit 1 ;;
              *)
                rm -rf -- "./$name" ;;
            esac
          done
          cp -R /tmp/pmsv-preview/. .

          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Sync latest PMSV app preview [skip ci]"
            git push origin gh-pages
          fi
