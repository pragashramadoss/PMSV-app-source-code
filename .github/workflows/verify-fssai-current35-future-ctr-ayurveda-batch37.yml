name: Verify future CTR commencement and Ayurveda licensing (Batch37)
on:
  push:
    branches: [gh-pages]
    paths:
      - 'fssai-product-helper-preview-01/data/rules/fssai-current35-future-amendment-and-ayurveda-license-batch37-2026-10-16.json'
      - 'fssai-product-helper-preview-01/fssai-current35-future-amendment-and-ayurveda-license-batch37-2026-10-16.js'
      - 'tests/fssai-current35-future-ctr-and-ayurveda-license-batch37-2026-10-16.test.cjs'
      - 'fssai-product-helper-preview-01/index.html'
      - '.github/workflows/verify-fssai-current35-future-ctr-ayurveda-batch37.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-batch37:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium for browser regression
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check Batch37 client JavaScript syntax
        run: node --check fssai-product-helper-preview-01/fssai-current35-future-amendment-and-ayurveda-license-batch37-2026-10-16.js
      - name: Verify 35-case CTR time lock and Ayurveda Central Licence pathways in Chromium
        run: node tests/fssai-current35-future-ctr-and-ayurveda-license-batch37-2026-10-16.test.cjs
