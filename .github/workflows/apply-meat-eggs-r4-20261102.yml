name: Apply meat and egg source review R4
on:
  push:
    branches: ['audit/all-533-2026-11-02']
    paths: ['.github/workflows/apply-meat-eggs-r4-20261102.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/audit/all-533-2026-11-02'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply hash-checked data patches
        run: |
          python3 - <<'PY'
          import base64,gzip,json,pathlib,hashlib,subprocess
          # JSON data operations, never an executable compressed payload.
          encoded=''
          raw=gzip.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(raw).hexdigest()=='d38cf4b850f58dd2c3e6013eaffd86ff7780e823b57092ed663bbda14d610e0a'
          patches=json.loads(raw)
          allowed={'fssai-product-helper-preview-01/data/rules/chapter-2-5-meat-eggs-v1.json','fssai-product-helper-preview-01/data/rules/appendix-b-v2-core.json'}
          assert len(patches)==2 and {p['path'] for p in patches}==allowed
          out=pathlib.Path('r4-application-results');out.mkdir()
          manifest=[]
          for patch in patches:
              path=pathlib.Path(patch['path'])
              assert subprocess.check_output(['git','hash-object',str(path)],text=True).strip()==patch['before_git_blob'],'Changed preimage; reconcile before applying'
              data=json.loads(path.read_text())
              for op in patch['operations']:
                  target=data
                  for key in op['path'][:-1]:target=target[key]
                  if op['op']=='set':target[op['path'][-1]]=op['value']
                  elif op['op']=='remove':del target[op['path'][-1]]
                  else:raise ValueError('unsupported data operation')
              content=(json.dumps(data,ensure_ascii=False,indent=2)+'\n').encode()
              assert hashlib.sha256(content).hexdigest()==patch['after_sha256'],'Output differs from locally tested repository module'
              path.write_bytes(content);(out/path.name).write_bytes(content)
              manifest.append({'path':str(path),'sha256':patch['after_sha256']})
          root=pathlib.Path('fssai-product-helper-preview-01/data')
          master=json.loads((root/'product-master-v1.json').read_text())
          assert len(master['catalog_products'])==533 and len({p['id'] for p in master['catalog_products']})==533
          chapter=json.loads((root/'rules/chapter-2-5-meat-eggs-v1.json').read_text())
          assert len(chapter['standards'])==20
          assert all(s['source_content_review']['current_law_complete'] is False for s in chapter['standards'])
          micro=json.loads((root/'rules/appendix-b-v2-core.json').read_text())
          for ident in ['08-08-3-meat-sausages-smoked','08-08-2-fermented-meat-products-whole-pieces-or-cuts']:
              assert not any(p['catalog_id']==ident for p in micro['product_mappings']['meat']['exact'])
              assert any(p['catalog_id']==ident for p in micro['product_mappings']['meat']['conditional'])
          (out/'application-manifest.json').write_text(json.dumps({'scope':'Source-edition data corrections, no current-law/product approval; normalized transcript and comparison tests supplied in continuation package.','modules':manifest,'catalogue':533,'standards':20},indent=2))
          print(json.dumps(manifest,indent=2))
          PY
      - name: Commit on audit branch only
        run: |
          test "${GITHUB_REF}" = 'refs/heads/audit/all-533-2026-11-02'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fssai-product-helper-preview-01/data/rules/chapter-2-5-meat-eggs-v1.json fssai-product-helper-preview-01/data/rules/appendix-b-v2-core.json
          git diff --cached --check
          git commit -m 'Review meat and eggs: scope storage clauses and make smoked/whole-cut micro routes conditional'
          git push origin HEAD:refs/heads/audit/all-533-2026-11-02
      - uses: actions/upload-artifact@v4
        with:
          name: meat-egg-review-r4-applied-20261102
          path: r4-application-results/
          retention-days: 3
          if-no-files-found: error
