name: R30 verify 17 FPSFA source standards within 26 FoSCoS-only cases
on:
  push:
    branches: ['audit/all-533-2026-11-02']
    paths: ['.github/workflows/verify-ctr-fssr-26-r30-20261104.yml']
permissions:
  contents: read
jobs:
  check:
    if: github.ref == 'refs/heads/audit/all-533-2026-11-02'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify 533 catalogue, 137 legal holds, 17 exact FSSR clauses and nine category routes
        run: python3 scripts/verify_ctr_fssr_26_r30_20261104.py
      - name: Protect operative rule data and original audit reports from accidental writes
        shell: bash
        run: |
          test -s fssai-helper/ctr-26-fssr-clause-reconciliation-r30-2026-11-04.json
          test -s fssai-helper/ctr-26-fssr-clause-reconciliation-r30-2026-11-04.md
          git diff --exit-code -- fssai-product-helper-preview-01/data/
          git diff --exit-code -- fssai-helper/ctr-137-source-screening-closure-r29-2026-11-04.json
          test -z "$(git status --porcelain)"
