name: Verify PMSV Batch108 settled startup status
on:
  push:
    branches: [gh-pages]
    paths:
      - 'fssai-product-helper-preview-01/fssai-current35-browser-review-integrity-batch22-2026-10-14.js'
      - 'fssai-product-helper-preview-01/fssai-current35-core-startup-batch70-2026-10-17.js'
      - 'tests/pmsv-batch108-startup-state-display.test.cjs'
      - '.github/workflows/verify-pmsv-batch108-startup-state-display.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-state-display:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Startup status event, authenticity, and browser-local review guards
        run: |
          node --check fssai-product-helper-preview-01/fssai-current35-browser-review-integrity-batch22-2026-10-14.js
          node --check fssai-product-helper-preview-01/fssai-current35-core-startup-batch70-2026-10-17.js
          node tests/pmsv-batch108-startup-state-display.test.cjs
          node tests/pmsv-batch107-cold-render-deferral.test.cjs
          node tests/pmsv-batch106-core-validation-cost.test.cjs
          node tests/pmsv-batch105-core-readiness-handoff.test.cjs
