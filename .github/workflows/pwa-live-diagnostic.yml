name: Check PMSV assetlinks path
on:
  push:
    branches: [pwa-diagnostic]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check assetlinks endpoint
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -sS -D /tmp/h -o /tmp/b https://pmsvgroup.com/.well-known/assetlinks.json || true
          cat /tmp/h || true
          cat /tmp/b || true
