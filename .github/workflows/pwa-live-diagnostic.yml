name: Diagnose live PMSV PWA
on:
  push:
    branches: [pwa-diagnostic]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: HTTP endpoint checks
        shell: bash
        run: |
          set -euxo pipefail
          echo "=== ROOT ==="
          curl -L -sS -D /tmp/root.h -o /tmp/root.html https://pmsvgroup.com/
          cat /tmp/root.h
          grep -oiE '<link[^>]+rel=["'\'' ]*manifest[^>]*>|<script[^>]*>[^<]{0,500}' /tmp/root.html | head -30 || true
          echo "=== MANIFEST ==="
          curl -L -sS -D /tmp/manifest.h -o /tmp/manifest.json https://pmsvgroup.com/manifest.webmanifest
          cat /tmp/manifest.h
          cat /tmp/manifest.json
          echo "=== SERVICE WORKER ==="
          curl -L -sS -D /tmp/sw.h -o /tmp/sw.js https://pmsvgroup.com/sw.js
          cat /tmp/sw.h
          head -80 /tmp/sw.js
          echo "=== ICONS ==="
          python - <<'PY'
          import json, urllib.request
          m=json.load(open('/tmp/manifest.json'))
          for icon in m.get('icons',[]):
              u=icon['src']
              if u.startswith('/'): u='https://pmsvgroup.com'+u
              try:
                  r=urllib.request.urlopen(u, timeout=15)
                  data=r.read()
                  print(u, r.status, r.headers.get_content_type(), len(data))
              except Exception as e:
                  print(u, 'ERROR', repr(e))
          PY
      - name: Chrome installability diagnostics
        shell: bash
        run: |
          set -euxo pipefail
          google-chrome --version || chromium-browser --version || chromium --version
          python -m pip install -q websocket-client requests
          CHROME=$(command -v google-chrome || command -v chromium-browser || command -v chromium)
          "$CHROME" --headless=new --no-sandbox --disable-gpu --remote-debugging-port=9222 --user-data-dir=/tmp/chrome-pmsv about:blank >/tmp/chrome.log 2>&1 &
          sleep 3
          python - <<'PY'
          import json,time,requests,websocket
          target=requests.put('http://127.0.0.1:9222/json/new?https://pmsvgroup.com/').json()
          ws=websocket.create_connection(target['webSocketDebuggerUrl'], timeout=20)
          n=0
          def call(method,params=None):
              global n
              n+=1
              ws.send(json.dumps({'id':n,'method':method,'params':params or {}}))
              while True:
                  m=json.loads(ws.recv())
                  if m.get('id')==n:
                      return m
          call('Page.enable')
          call('Runtime.enable')
          call('Page.navigate',{'url':'https://pmsvgroup.com/'})
          time.sleep(12)
          print('URL',call('Runtime.evaluate',{'expression':'location.href','returnByValue':True}))
          print('MANIFEST',json.dumps(call('Page.getAppManifest'),indent=2)[:20000])
          print('INSTALLABILITY',json.dumps(call('Page.getInstallabilityErrors'),indent=2)[:20000])
          expr="""(async()=>({
            secure:window.isSecureContext,
            manifest:[...document.querySelectorAll('link[rel="manifest"]')].map(x=>x.href),
            sw:await navigator.serviceWorker.getRegistrations().then(rs=>rs.map(r=>({scope:r.scope,active:r.active&&r.active.scriptURL,installing:r.installing&&r.installing.scriptURL,waiting:r.waiting&&r.waiting.scriptURL}))),
            controller:navigator.serviceWorker.controller&&navigator.serviceWorker.controller.scriptURL,
            standalone:matchMedia('(display-mode: standalone)').matches,
            ua:navigator.userAgent
          }))()"""
          print('RUNTIME',json.dumps(call('Runtime.evaluate',{'expression':expr,'awaitPromise':True,'returnByValue':True}),indent=2)[:20000])
          ws.close()
          PY
          cat /tmp/chrome.log || true
