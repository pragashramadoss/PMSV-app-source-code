name: Verify PMSV Batch99 105-gate evidence dependency audit
on:
  push:
    branches: [gh-pages]
    paths:
      - 'fssai-product-helper-preview-01/pmsv-batch99-downstream-evidence-dependency-audit-2026-10-25.js'
      - 'fssai-product-helper-preview-01/index.html'
      - 'fssai-product-helper-preview-01/data/rules/fssai-current35-175-proof-reference-triage-batch56-2026-10-16.json'
      - 'tests/pmsv-batch99-downstream-audit.test.cjs'
      - '.github/workflows/verify-pmsv-batch99-downstream-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-ledger-downstream-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm 105 original HELD gates and stale-review invalidation
        run: node tests/pmsv-batch99-downstream-audit.test.cjs
