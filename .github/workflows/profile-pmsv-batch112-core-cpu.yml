name: Profile PMSV Batch112 cold core CPU functions
on:
  push:
    branches: [gh-pages]
    paths:
      - 'tests/pmsv-batch112-core-cpu-profile.test.cjs'
      - '.github/workflows/profile-pmsv-batch112-core-cpu.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-function-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser profile runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Syntax and fail-closed regression checks
        run: |
          node --check tests/pmsv-batch112-core-cpu-profile.test.cjs
          node tests/pmsv-batch108-startup-state-display.test.cjs
          node tests/pmsv-batch110-snapshot-string-cache.test.cjs
          node tests/fssai-current-111-decision-gates-2026-10-12.test.cjs
          node tests/fssai-live-111-official-article-crosswalk-2026-10-12.test.cjs
          node tests/pmsv-batch107-cold-render-deferral.test.cjs
      - name: Profile complete 4x-slowed verified core
        run: node tests/pmsv-batch112-core-cpu-profile.test.cjs
        timeout-minutes: 8
      - name: Keep CPU function profile for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmsv-batch112-verified-core-cpu-profile
          path: pmsv-batch112-cpu-profile.json
          if-no-files-found: ignore
          retention-days: 14
