name: Verify current FSSAI 450/83 first sources (fast)
on:
  push:
    branches: [gh-pages]
    paths:
      - 'fssai-product-helper-preview-01/**'
      - 'tests/fssai-first-source-current-450-83-2026-10-12.test.cjs'
      - '.github/workflows/verify-current-fssai-450-83.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify current 450/83 first-source evidence and negative controls
        run: node --test tests/fssai-first-source-current-450-83-2026-10-12.test.cjs
      - name: Syntax-check current and archived FSSAI source modules
        run: |
          node --check fssai-product-helper-preview-01/fssai-first-source-current-450-83.js
          node --check fssai-product-helper-preview-01/fssai-first-source-current-446-87.js
          node --check fssai-product-helper-preview-01/fssai-2026-may-533-89-effective-date.js
