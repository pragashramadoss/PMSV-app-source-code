name: Verify FSSAI 35-case documentary adjudication workbench Batch14
on:
  push:
    branches: [gh-pages]
    paths:
      - 'fssai-product-helper-preview-01/data/rules/fssai-current35-adjudication-workbench-batch14-2026-10-13.json'
      - 'fssai-product-helper-preview-01/fssai-current35-evidence-workbench-batch14-2026-10-13.js'
      - 'fssai-product-helper-preview-01/index.html'
      - 'tests/fssai-current35-documentary-adjudication-workbench-batch14-2026-10-13.test.cjs'
      - '.github/workflows/verify-fssai-current35-adjudication-batch14.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify unique 35-case evidence and false-PASS protection
        run: node --test tests/fssai-current35-documentary-adjudication-workbench-batch14-2026-10-13.test.cjs
      - name: Syntax check workbench module
        run: node --check fssai-product-helper-preview-01/fssai-current35-evidence-workbench-batch14-2026-10-13.js
