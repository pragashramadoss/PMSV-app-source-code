name: Verify FSSAI Batch66 nutraceutical ingredient scope
on:
  push:
    branches: [gh-pages]
    paths:
      - 'fssai-product-helper-preview-01/data/rules/fssai-current35-nutra-ingredient-scope-batch66-2026-10-17.json'
      - 'fssai-product-helper-preview-01/fssai-current35-nutra-ingredient-scope-batch66-2026-10-17.js'
      - 'tests/fssai-current35-nutra-ingredient-scope-batch66-2026-10-17.test.cjs'
      - 'FSSAI-CURRENT35-BATCH66-NUTRA-SOURCE-SCOPE-2026-10-17.md'
      - 'fssai-product-helper-preview-01/index.html'
      - '.github/workflows/verify-fssai-current35-nutra-ingredient-batch66.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-batch66-isolated-component:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check Batch66 JavaScript and test syntax
        run: |
          node --check fssai-product-helper-preview-01/fssai-current35-nutra-ingredient-scope-batch66-2026-10-17.js
          node --check tests/fssai-current35-nutra-ingredient-scope-batch66-2026-10-17.test.cjs
      - name: Validate five P1 source gates and isolated browser component
        run: node tests/fssai-current35-nutra-ingredient-scope-batch66-2026-10-17.test.cjs
