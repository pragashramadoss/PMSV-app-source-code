name: Verify PMSV Batch94 35 case 175 proof handoff
on:
  push:
    branches: [gh-pages]
    paths:
      - 'fssai-product-helper-preview-01/pmsv-batch93-legal-lab-readiness-ui-2026-10-20.js'
      - 'fssai-product-helper-preview-01/data/rules/PMSV-B94-175-ORIGINAL-UNSENT-EVIDENCE-REQUESTS-2026-10-20.csv'
      - 'PMSV-B94-35-COMMERCIAL-PRODUCT-APPROVAL-SIGNOFF-FORMS-HELD-2026-10-20.csv'
      - 'tests/pmsv-batch94-175-35-handoff-integrity.test.cjs'
      - '.github/workflows/verify-pmsv-batch94-bulk-evidence-handoff.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bulk-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check fssai-product-helper-preview-01/pmsv-batch93-legal-lab-readiness-ui-2026-10-20.js
          node tests/pmsv-batch93-legal-lab-readiness.test.cjs
          node tests/pmsv-batch94-175-35-handoff-integrity.test.cjs
