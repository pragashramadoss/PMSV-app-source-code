name: Verify 7 official FSSR standards (Batch29)
on:
  push:
    branches: [gh-pages]
    paths:
      - 'fssai-product-helper-preview-01/data/rules/fssai-current35-product-identity-first-sources-batch29-2026-10-16.json'
      - 'fssai-product-helper-preview-01/fssai-current35-product-identity-first-sources-batch29-2026-10-16.js'
      - 'tests/fssai-current35-product-identity-first-sources-batch29-2026-10-16.test.cjs'
      - 'fssai-product-helper-preview-01/index.html'
      - '.github/workflows/verify-fssai-current35-product-standards-batch29.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-product-standards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium integration test
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate FSSR standards script
        run: node --check fssai-product-helper-preview-01/fssai-current35-product-identity-first-sources-batch29-2026-10-16.js
      - name: Test FSSR source identity and absence of false CTR approvals
        run: node tests/fssai-current35-product-identity-first-sources-batch29-2026-10-16.test.cjs
