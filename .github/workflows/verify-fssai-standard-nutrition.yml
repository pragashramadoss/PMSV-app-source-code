permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fail-fast current 111 finished-product decision gate checks
        run: node --test tests/fssai-current-111-decision-gates-2026-10-12.test.cjs
      - name: Fail-fast current 111 source crosswalk regression
        run: node --test tests/fssai-live-111-official-article-crosswalk-2026-10-12.test.cjs
      - name: Verify all official FSSAI regulatory route links
        run: node scripts/verify-fssai-regulatory-routes.cjs
      - name: Generate all 533 regulatory evidence readiness records
        run: node scripts/audit-fssai-product-readiness.cjs
      - name: Triage unresolved FSSAI contaminant-evidence scopes for all 533 local identities
        run: node scripts/triage-fssai-contaminant-evidence.cjs
      - name: Reconcile the remaining 126 exact product/source applicability reviews
        run: node scripts/audit-all-161-pending-source-matrix-gates.cjs
      - name: Validate new source-pinned frozen confections and onion/non-onion Lead article identities
        run: node scripts/audit-fssai-two-subtype-first-exact-source.cjs
      - name: Audit source evidence conservation across all 533 products
        run: node scripts/audit-fssai-evidence-ledger-conservation.cjs
      - name: Generate 533 universal Methyl Mercury and 726 metal default source-priority audit decisions
        run: node scripts/audit-fssai-v9-metal-fallback-precedence.cjs
      - name: Verify nine official Ayurveda Aahara product recipes against crop-contaminant articles
        run: node scripts/audit-fssai-ayurveda-nine-recipe-source-gates.cjs
      - name: Validate all ten FSSR 2.3.62 edible fungi product quality and species source gates
        run: node scripts/audit-fssai-ten-edible-fungi-source-gates.cjs
      - name: Audit 11 official FSSAI chutney, pickles, pastes and pulp quality standards
        run: node scripts/audit-fssai-11-chapter-2-3-quality-routes.cjs
      - name: Export 121 unresolved product source-research worksheet
        run: node scripts/export-fssai-next-123-source-research-queue.cjs
      - name: Verify two new exact conditional source articles, positive and negative subtype paths
        run: node --test tests/fssai-two-subtype-first-exact-source-2026-10-11.test.cjs tests/fssai-two-subtype-metal-ui-2026-10-11.test.cjs
      - name: Verify 48 FSSAI Chapter 2.3 source quality rules and fail-closed Helper display
        run: node --test tests/fssai-11-chapter-2-3-source-quality-2026-10-11.test.cjs tests/fssai-11-chapter-2-3-source-quality-ui-2026-10-11.test.cjs
      - name: Verify fungi quality criteria and exact product UI source guards
        run: node --test tests/fssai-ten-edible-fungi-quality-source-2026-10-11.test.cjs tests/fssai-ten-edible-fungi-live-quality-ui-2026-10-11.test.cjs
      - name: Verify source-pinned nine Ayurveda Aahara product recipes and B1 overlap candidates
        run: node --test tests/fssai-ayurveda-nine-recipe-b1-source-gates-2026-10-11.test.cjs tests/fssai-ayurveda-nine-recipe-ui-2026-10-11.test.cjs
      - name: Verify all 121 product source-priority panels and research exports reject wrong article mappings
        run: node --test tests/fssai-v9-metal-priority-helper-123-2026-10-11.test.cjs
      - name: Verify official Version IX default metal and universal Methyl Mercury rows
        run: node --test tests/fssai-v9-metal-fallback-precedence-533-123-2026-10-11.test.cjs
      - name: Verify 13 named FSSAI tin articles and 61 no-transfer conditions
        run: node --test tests/fssai-v9-tin-conditional-123-source-matrix-2026-10-11.test.cjs
      - name: Verify expanded 121-product named article nontransfer matrix
        run: node --test tests/fssai-v9-expanded-identity-nontransfer-2026-10-11.test.cjs
      - name: Validate all 61 FSSAI metal source article testing bases and 121 pending worksheets
        run: node --test tests/fssai-v9-61-metal-testing-basis-integrity-2026-10-11.test.cjs
      - name: Verify 30 new source-locked Version IX cross-metal and subtype article audits
        run: node --test tests/fssai-v9-cross-metal-matrix-2026-10-11.test.cjs
      - name: Audit seven exact FSSAI product quality routes, salt magnesium and 121 pesticide commodity matches
        run: node --test tests/fssai-seven-official-product-quality-and-ctr-no-inheritance-2026-10-11.test.cjs
      - name: Check 49 official FSSR quality criteria in six pending products and 2025 colostrum IgG
        run: node --test tests/fssai-six-pending-chapter-quality-source-2026-10-11.test.cjs
      - name: Validate eight FSSAI product quality panels across eleven forms and 61 source conditions
        run: node --test tests/fssai-eight-pending-chapter-quality-subtypes-2026-10-11.test.cjs
      - name: Confirm 21 interactive finished-food subtype selections remain source-only and fail closed
        run: node --test tests/fssai-finished-food-interactive-subtype-source-gates-2026-10-11.test.cjs
      - name: Verify conditional finished-food FSSAI legal metal articles for nine unresolved FoSCoS products
        run: node --test tests/fssai-v9-processed-food-exact-subtype-2026-10-11.test.cjs
      - name: Verify actual Helper UI renders 387 current product-specific metal article scope safeguards
        run: node --test tests/fssai-v9-387-source-scope-live-ui-2026-10-11.test.cjs
      - name: Assert full 121-personalized-FSSAI-first-source worklists remain unresolved
        run: node --test tests/fssai-next-123-actionable-worklist-2026-10-11.test.cjs
      - name: Validate 121 positive subtype/source evidence blockers and 20 official articles
        run: node --test tests/fssai-next121-positive-subtype-proof-2026-10-11.test.cjs
      - name: Verify 29 unmatched product identity gates and 20 official Version IX reference articles
        run: node --test tests/fssai-next29-unmatched-source-dossiers-2026-10-11.test.cjs tests/fssai-next121-live-version-ix-source-row-lock-2026-10-11.test.cjs
      - name: Verify all 121 live first-source proof panels and 29 special product dossiers
        run: node --test tests/fssai-next121-29-live-source-proof-ui-2026-10-11.test.cjs
      - name: Verify positive composite-food aflatoxin source for two finished Ayurveda Aahara recipes
        run: node --test tests/fssai-ayurveda-two-positive-composite-aflatoxin-2026-10-11.test.cjs
      - name: Verify 153 official FSSAI named article decisions and positive two-product source proof
        run: node --test tests/fssai-all153-candidate-article-applicability-2026-10-11.test.cjs
      - name: Reconcile 533 product first-source audit against two exact Ayurveda source matches
        run: node scripts/audit-fssai-current-first-source-reconciliation-2026-10-11.cjs && node --test tests/fssai-current-first-source-reconciliation-screen-2026-10-11.test.cjs
      - name: Verify three FSSR canned-subtype source tables, 8 forms and 16 official metal references
        run: node --test tests/fssai-three-canned-forms-official-source-proof-2026-10-11.test.cjs
      - name: Validate first source for FSSR 2.4.6(15) any other foodgrains
        run: node --test tests/fssai-other-foodgrains-direct-source-2026-10-11.test.cjs
      - name: Verify 14 sugar, confection and processed-egg finished-form source gates
        run: node --test tests/fssai-14-finished-matrix-source-gates-2026-10-11.test.cjs
      - name: Validate twenty fungi mushroom, fruit pulp, mango chutney and tomato product form gates
        run: node --test tests/fssai-20-fungi-fruit-tomato-branch-gates-2026-10-11.test.cjs
      - name: Reconcile cross-family 34 product source-qualification controls
        run: node scripts/audit-fssai-34-finished-form-conditionals-2026-10-11.cjs
      - name: Verify 56 independently reviewed pending identities and their live fail-closed FSSAI scope panels
        run: node --test tests/fssai-56-cross-form-nontransfer-live-panels-2026-10-11.test.cjs
      - name: Reconcile all 533 FSSAI identities to 417 partial source matches and 116 still pending
        run: node scripts/audit-fssai-current-417-116-and-rabbit-veterinary-first-source-2026-10-11.cjs
      - name: Verify official rabbit veterinary-tissue source and final 28-product evidence UI
        run: node --test tests/fssai-current-417-116-rabbit-first-source-and-28-remaining-ui-2026-10-11.test.cjs
      - name: Verify 21 official veterinary tolerance rows and 64 rabbit casing and processed egg source links
        run: node --test tests/fssai-v9-veterinary-21-rows-64-article-links-2026-10-11.test.cjs
      - name: Verify authoritative 533-product current 417 partial / 116 pending ledger and FSSAI 2024 colouring-foods quality corrections
        run: node --test tests/fssai-current-533-417-116-source-ledger-and-2024-quality-2026-10-11.test.cjs
      - name: Upload per-product compliance evidence audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fssai-product-readiness-audit
          path: |
            audit-output/fssai-product-readiness-audit.json
            audit-output/fssai-contaminant-review-queue.md
            audit-output/fssai-current-first-source-533-reconciliation-v2.json
            audit-output/fssai-contaminant-evidence-disposition-533.json
            audit-output/fssai-contaminant-evidence-disposition-summary.md
            audit-output/fssai-126-detailed-source-applicability-reconciliation.json
            audit-output/fssai-live-first-source-ledger-533.json
            audit-output/fssai-next-121-first-exact-source-research-queue.csv
            audit-output/fssai-next-121-first-exact-source-research-queue.json
            audit-output/fssai-v9-all-533-methylmercury-and-121-fallback-source-review.json
            audit-output/fssai-ayurveda-nine-recipe-source-review.json
            audit-output/fssai-ten-edible-fungi-quality-vs-ctr-review.json
            audit-output/fssai-11-fruit-pickle-sauce-source-quality.json
          if-no-files-found: warn
      - name: Verify 43 exact official CTR named-article conditional routes across current 116 cases
