name: Verify PMSV FSSAI standard nutrition
on:
  push:
    branches:
      - gh-pages
    paths:
      - 'fssai-product-helper-preview-01/**'
      - 'tests/standardized-ifct-lookup-v477.test.cjs'
      - 'tests/fssai-nutrition-v476.test.cjs'
      - 'tests/nutrition-modules.test.cjs'
      - 'tests/fssai-dairy-composition-v481.test.cjs'
      - 'tests/fssai-standard-key-scope-v482.test.cjs'
      - 'tests/fssai-ragi-grain-v483.test.cjs'
      - 'tests/fssai-pulse-grain-v488.test.cjs'
      - 'tests/fssai-catalogue-audit-v485.test.cjs'
      - 'tests/fssai-chapter-2-3-numeric-baselines.test.cjs'
      - 'tests/fssai-chapter-2-4-numeric-baselines.test.cjs'
      - 'tests/fssai-source-pinned-ui-evidence.test.cjs'
      - 'tests/fssai-product-additive-restrictions.test.cjs'
      - 'tests/fssai-contaminants-direct-microbiology.test.cjs'
      - 'tests/fssai-ingredient-contaminant-source-gates.test.cjs'
      - 'tests/fssai-chapter-2-8-direct-beeswax-lead.test.cjs'
      - 'tests/fssai-sucralose-heavy-metals-vs-lead.test.cjs'
      - 'tests/fssai-2026-ctr-changeover-guard.test.cjs'
      - 'tests/fssai-2026-deferred-amendment-register.test.cjs'
      - 'tests/fssai-mineral-water-arsenic-two-source-reconciliation.test.cjs'
      - 'tests/fssai-saccharin-product-standard-impurities.test.cjs'
      - 'tests/fssai-v9-profile-metal-source-gate.test.cjs'
      - 'tests/fssai-whole-bean-pulse-metal-source-gate.test.cjs'
      - 'tests/fssai-v9-profile-toxins-source-gate.test.cjs'
      - 'tests/fssai-spice-aflatoxin-source-gate.test.cjs'
      - 'tests/fssai-v9-explicit-metal-alias-source-gate.test.cjs'
      - 'tests/fssai-tomato-ketchup-copper-subtype-gate.test.cjs'
      - 'tests/fssai-polished-rice-cadmium-subtype-gate.test.cjs'
      - 'tests/fssai-chapter-2-10-water-fluoride.test.cjs'
      - 'tests/fssai-chapter-2-10-water-pesticides.test.cjs'
      - 'tests/fssai-chapter-2-7-contaminant-lock.test.cjs'
      - 'tests/fssai-chapter-2-5-meat-egg-residue-review.test.cjs'
      - 'tests/fssai-chapter-2-4-commodity-residue-review.test.cjs'
      - 'tests/fssai-alcoholic-beverage-toxins.test.cjs'
      - 'tests/fssai-processed-meat-saffrole.test.cjs'
      - 'tests/fssai-chapter-2-10-beverage-saffrole.test.cjs'
      - 'tests/fssai-chapter-2-4-pure-cereal-aflatoxins.test.cjs'
      - 'tests/fssai-chapter-2-2-oil-metal-articles.test.cjs'
      - 'tests/fssai-chapter-2-3-fresh-vegetable-metals.test.cjs'
      - 'scripts/verify-fssai-regulatory-routes.cjs'
      - 'scripts/audit-fssai-product-readiness.cjs'
      - 'scripts/triage-fssai-contaminant-evidence.cjs'
      - '.github/workflows/verify-fssai-standard-nutrition.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify all official FSSAI regulatory route links
        run: node scripts/verify-fssai-regulatory-routes.cjs
      - name: Generate all 533 regulatory evidence readiness records
        run: node scripts/audit-fssai-product-readiness.cjs
      - name: Triage unresolved FSSAI contaminant-evidence scopes for all 533 local identities
        run: node scripts/triage-fssai-contaminant-evidence.cjs
      - name: Upload per-product compliance evidence audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fssai-product-readiness-audit
          path: |
            audit-output/fssai-product-readiness-audit.json
            audit-output/fssai-contaminant-review-queue.md
            audit-output/fssai-contaminant-evidence-disposition-533.json
            audit-output/fssai-contaminant-evidence-disposition-summary.md
          if-no-files-found: warn
      - name: Check helper JavaScript syntax and exact IFCT reference behavior
        run: node --test tests/standardized-ifct-lookup-v477.test.cjs tests/fssai-nutrition-v476.test.cjs tests/nutrition-modules.test.cjs tests/fssai-dairy-composition-v481.test.cjs tests/fssai-standard-key-scope-v482.test.cjs tests/fssai-ragi-grain-v483.test.cjs tests/fssai-catalogue-audit-v485.test.cjs tests/fssai-chapter-2-3-numeric-baselines.test.cjs tests/fssai-chapter-2-4-numeric-baselines.test.cjs tests/fssai-source-pinned-ui-evidence.test.cjs tests/fssai-product-additive-restrictions.test.cjs tests/fssai-contaminants-direct-microbiology.test.cjs tests/fssai-ingredient-contaminant-source-gates.test.cjs tests/fssai-chapter-2-8-direct-beeswax-lead.test.cjs tests/fssai-sucralose-heavy-metals-vs-lead.test.cjs tests/fssai-2026-ctr-changeover-guard.test.cjs tests/fssai-2026-deferred-amendment-register.test.cjs tests/fssai-mineral-water-arsenic-two-source-reconciliation.test.cjs tests/fssai-saccharin-product-standard-impurities.test.cjs tests/fssai-v9-profile-metal-source-gate.test.cjs tests/fssai-spice-aflatoxin-source-gate.test.cjs tests/fssai-polished-rice-cadmium-subtype-gate.test.cjs tests/fssai-v9-explicit-metal-alias-source-gate.test.cjs tests/fssai-tomato-ketchup-copper-subtype-gate.test.cjs tests/fssai-chapter-2-10-water-fluoride.test.cjs tests/fssai-chapter-2-10-water-pesticides.test.cjs tests/fssai-chapter-2-7-contaminant-lock.test.cjs tests/fssai-chapter-2-5-meat-egg-residue-review.test.cjs tests/fssai-chapter-2-4-commodity-residue-review.test.cjs tests/fssai-alcoholic-beverage-toxins.test.cjs tests/fssai-processed-meat-saffrole.test.cjs tests/fssai-chapter-2-10-beverage-saffrole.test.cjs tests/fssai-chapter-2-4-pure-cereal-aflatoxins.test.cjs tests/fssai-chapter-2-2-oil-metal-articles.test.cjs tests/fssai-chapter-2-3-fresh-vegetable-metals.test.cjs tests/fssai-pulse-grain-v488.test.cjs tests/fssai-whole-bean-pulse-metal-source-gate.test.cjs tests/fssai-v9-profile-toxins-source-gate.test.cjs
