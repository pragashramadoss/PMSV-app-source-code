name: Verify PMSV Batch86 original 35 and all-533 real CSV exports
on:
  push:
    branches: [gh-pages]
    paths:
      - 'fssai-product-helper-preview-01/fssai-final35-legal-review-2026-10-18.js'
      - 'tests/pmsv-batch86-533-csv-functional.test.cjs'
      - 'tests/fssai-final35-real-preview.test.cjs'
      - '.github/workflows/verify-pmsv-batch86-533-csv-exports.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-533:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check 533-row reconciled source ledger and both export paths
        run: |
          node --check fssai-product-helper-preview-01/fssai-final35-legal-review-2026-10-18.js
          node tests/pmsv-batch84-23-official-named-article-comparators.test.cjs
          node tests/pmsv-batch85-all35-source-applicability.test.cjs
          node tests/pmsv-batch86-533-csv-functional.test.cjs
          node tests/pmsv-public-source-review-completion.test.cjs
