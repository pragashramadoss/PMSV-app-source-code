name: Verify 35 FSSAI analytical evidence packets (Batch38)
on:
  push:
    branches: [gh-pages]
    paths:
      - 'fssai-product-helper-preview-01/data/rules/fssai-current35-analytical-evidence-packets-batch38-2026-10-16.json'
      - 'fssai-product-helper-preview-01/fssai-current35-analytical-evidence-packets-batch38-2026-10-16.js'
      - 'tests/fssai-current35-analytical-evidence-batch38-2026-10-16.test.cjs'
      - 'fssai-product-helper-preview-01/index.html'
      - '.github/workflows/verify-fssai-current35-lab-evidence-batch38.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-batch38:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check Batch38 preview JavaScript syntax
        run: node --check fssai-product-helper-preview-01/fssai-current35-analytical-evidence-packets-batch38-2026-10-16.js
      - name: Test 35 evidence packets, five method families and date locks in real browser
        run: node tests/fssai-current35-analytical-evidence-batch38-2026-10-16.test.cjs
