name: PMSV R57 child supplement FSSR 2.4.11(4) source verification
on:
  push:
    branches:
      - audit/all-533-2026-11-02
    paths:
      - 'fssai-helper/ctr-child-supplement-fssr-standard-r57-2026-11-04.json'
      - 'fssai-helper/ctr-child-supplement-source-gate-r57-20261104.mjs'
      - 'scripts/test_ctr_child_supplement_r57_20261104.mjs'
      - '.github/workflows/verify-ctr-child-supplement-r57-20261104.yml'
  pull_request:
    branches:
      - gh-pages
    paths:
      - 'fssai-helper/ctr-child-supplement-fssr-standard-r57-2026-11-04.json'
      - 'fssai-helper/ctr-child-supplement-source-gate-r57-20261104.mjs'
      - 'scripts/test_ctr_child_supplement_r57_20261104.mjs'
  workflow_dispatch:
jobs:
  current-amendment-and-no-legal-PASS:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source identity, age, 2021/2023 updates and 137 holds
        run: node scripts/test_ctr_child_supplement_r57_20261104.mjs
