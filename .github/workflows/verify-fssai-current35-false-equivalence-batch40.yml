name: Verify current 35 FSSAI CTR exact-article contrasts (Batch40)
on:
  push:
    branches: [gh-pages]
    paths:
      - 'fssai-product-helper-preview-01/data/rules/fssai-current35-false-equivalence-article-crosswalk-batch40-2026-10-16.json'
      - 'fssai-product-helper-preview-01/fssai-current35-false-equivalence-crosswalk-batch40-2026-10-16.js'
      - 'tests/fssai-current35-false-equivalence-crosswalk-batch40-2026-10-16.test.cjs'
      - 'fssai-product-helper-preview-01/index.html'
      - '.github/workflows/verify-fssai-current35-false-equivalence-batch40.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-current35-batch40:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify current35 Batch40 JavaScript syntax
        run: node --check fssai-product-helper-preview-01/fssai-current35-false-equivalence-crosswalk-batch40-2026-10-16.js
      - name: Verify 35 exact-article blockers and original source evidence in Chromium
        run: node tests/fssai-current35-false-equivalence-crosswalk-batch40-2026-10-16.test.cjs
