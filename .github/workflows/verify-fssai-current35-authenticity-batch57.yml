name: Verify FSSAI Batch57 1295 authenticity and laboratory preflight checks
on:
  push:
    branches: [gh-pages]
    paths:
      - 'fssai-product-helper-preview-01/data/rules/fssai-current35-authentication-scope-preflight-batch57-2026-10-16.json'
      - 'fssai-product-helper-preview-01/fssai-current35-authentication-scope-preflight-batch57-2026-10-16.js'
      - 'tests/fssai-current35-authenticity-scope-batch57-2026-10-16.test.cjs'
      - 'FSSAI-CURRENT35-BATCH57-AUTHENTICITY-MATRIX-SCOPE-1295-CHECKS-2026-10-16.md'
      - 'fssai-product-helper-preview-01/index.html'
      - '.github/workflows/verify-fssai-current35-authenticity-batch57.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-batch57:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Syntax check Batch57 source and laboratory-scope UI
        run: node --check fssai-product-helper-preview-01/fssai-current35-authentication-scope-preflight-batch57-2026-10-16.js
      - name: Verify 1295 checks, 175 historical gates, lab scope and fail-closed draft restore
        run: node tests/fssai-current35-authenticity-scope-batch57-2026-10-16.test.cjs
