name: Verify 35-case conditional positive CTR source candidates (Batch 9)
on:
  push:
    branches: [gh-pages]
    paths:
      - 'fssai-product-helper-preview-01/index.html'
      - 'fssai-product-helper-preview-01/fssai-current35-positive-source-gates-batch9-2026-10-13.js'
      - 'fssai-product-helper-preview-01/data/rules/fssai-current35-positive-named-ctr-candidate-gates-batch9-2026-10-13.json'
      - 'fssai-product-helper-preview-01/data/rules/fssai-current-35-first-exact-source-proof-worklist-2026-10-13.json'
      - 'fssai-product-helper-preview-01/data/rules/fssai-current-first-source-533-live-ledger-498-35-2026-10-13.json'
      - 'tests/fssai-current35-positive-source-batch9-2026-10-13.test.cjs'
      - '.github/workflows/verify-fssai-current35-positive-source-batch9.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-positive-source-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate 35 original pending IDs, three conditional source branches and no regulatory promotion
        run: node --test tests/fssai-current35-positive-source-batch9-2026-10-13.test.cjs
      - name: Verify JS grammar
        run: node --check fssai-product-helper-preview-01/fssai-current35-positive-source-gates-batch9-2026-10-13.js
