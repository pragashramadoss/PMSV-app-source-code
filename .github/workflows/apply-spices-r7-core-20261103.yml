name: Apply R7 spice-form route corrections
on:
  push:
    branches: ['audit/all-533-2026-11-02']
    paths: ['.github/workflows/apply-spices-r7-core-20261103.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/audit/all-533-2026-11-02'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply preimage-checked route corrections
        run: python3 scripts/apply_spices_r7_core_20261103.py
      - name: Commit only tested data files to the audit branch
        shell: bash
        run: |
          test "${GITHUB_REF}" = 'refs/heads/audit/all-533-2026-11-02'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fssai-product-helper-preview-01/data/product-master-v1.json fssai-product-helper-preview-01/data/rules/appendix-b-v2-core.json
          git diff --cached --check
          git commit -m 'Require actual form for bay-leaf and mint microbiology selection'
          git push origin HEAD:refs/heads/audit/all-533-2026-11-02
      - uses: actions/upload-artifact@v4
        with:
          name: spices-r7-core-applied-20261103
          path: spices-r7-core-applied/
          retention-days: 3
          if-no-files-found: error
