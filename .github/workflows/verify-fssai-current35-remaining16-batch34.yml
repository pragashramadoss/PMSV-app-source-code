name: Verify remaining 16 PMSV FSSAI identity cases (Batch34)
on:
  push:
    branches: [gh-pages]
    paths:
      - 'fssai-product-helper-preview-01/data/rules/fssai-current35-remaining16-identity-source-review-batch34-2026-10-16.json'
      - 'fssai-product-helper-preview-01/fssai-current35-remaining16-identity-source-review-batch34-2026-10-16.js'
      - 'tests/fssai-current35-remaining16-identity-source-batch34-2026-10-16.test.cjs'
      - 'fssai-product-helper-preview-01/index.html'
      - '.github/workflows/verify-fssai-current35-remaining16-batch34.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-remaining16:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium integration test
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate FSSAI review script syntax
        run: node --check fssai-product-helper-preview-01/fssai-current35-remaining16-identity-source-review-batch34-2026-10-16.js
      - name: Verify zero CTR transfers and searchable 16-case browser matrix
        run: node tests/fssai-current35-remaining16-identity-source-batch34-2026-10-16.test.cjs
