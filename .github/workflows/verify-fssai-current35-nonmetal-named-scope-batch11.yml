name: Verify current 35 nonmetal exact source gates (Batch 11)
on:
  push:
    branches: [gh-pages]
    paths:
      - 'fssai-product-helper-preview-01/data/rules/fssai-current35-nonmetal-named-scope-batch11-2026-10-13.json'
      - 'fssai-product-helper-preview-01/fssai-current35-nonmetal-named-scope-batch11-2026-10-13.js'
      - 'tests/fssai-current35-nonmetal-named-scope-batch11-2026-10-13.test.cjs'
      - '.github/workflows/verify-fssai-current35-nonmetal-named-scope-batch11.yml'
      - 'fssai-product-helper-preview-01/index.html'
      - 'fssai-product-helper-preview-01/data/rules/fssai-current-first-source-533-live-ledger-498-35-2026-10-13.json'
      - 'fssai-product-helper-preview-01/data/rules/fssai-current-35-first-exact-source-proof-worklist-2026-10-13.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify 280 legal source specificity decisions
        run: node --test tests/fssai-current35-nonmetal-named-scope-batch11-2026-10-13.test.cjs
      - name: Syntax-check live browser panel
        run: node --check fssai-product-helper-preview-01/fssai-current35-nonmetal-named-scope-batch11-2026-10-13.js
