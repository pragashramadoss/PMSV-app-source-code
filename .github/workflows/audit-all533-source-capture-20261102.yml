name: Full 533 official-source capture
on:
  push:
    branches: ['audit/all-533-2026-11-02']
    paths: ['.github/workflows/audit-all533-source-capture-20261102.yml']
permissions:
  contents: read
jobs:
  source-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Capture public FSSAI sources and inventory all catalogue links
        run: |
          python3 - <<'PY'
          import json, pathlib, urllib.request, urllib.parse, concurrent.futures, hashlib, subprocess, shutil, datetime, collections
          root=pathlib.Path('fssai-product-helper-preview-01')
          out=pathlib.Path('full533-source-capture'); out.mkdir()
          master=json.loads((root/'data/product-master-v1.json').read_text())
          assert len(master['catalog_products'])==533
          assert len({r['id'] for r in master['catalog_products']})==533
          names={pathlib.Path(r['rule_file']).name for r in master['catalog_products'] if r.get('rule_file')}
          names.update(['appendix-a-v3-core.json','appendix-b-v2-core.json','appendix-c-v2-core.json','contaminants-v9-core.json','labelling-display-v8-core.json','packaging-current-core.json','advertising-claims-v4-core.json','special-regulatory-routes-v1.json','contaminants-2026-deferred-amendment-v1.json'])
          targets={}
          def add(url, module):
              if not isinstance(url,str) or not url.startswith('https://'): return
              host=urllib.parse.urlsplit(url).hostname or ''
              if host!='fssai.gov.in' and not host.endswith('.fssai.gov.in'): return
              targets.setdefault(url,[]).append(module)
          for name in sorted(names):
              p=root/'data/rules'/name
              if not p.exists(): continue
              d=json.loads(p.read_text())
              sources=d.get('official_sources',[])
              if isinstance(sources,dict): sources=list(sources.values())
              for s in sources:
                  if isinstance(s,dict): add(s.get('url'),name)
                  elif isinstance(s,str): add(s,name)
              for key in ['official_source','source']:
                  s=d.get(key)
                  add(s.get('url') if isinstance(s,dict) else s,name)
          for url in [
              'https://www.fssai.gov.in/upload/notifications/2026/05/6a153836a83d5272840.pdf',
              'https://www.fssai.gov.in/upload/advisories/2026/07/6a604e4037173Direction_Coffee%20Chicory.pdf',
              'https://www.fssai.gov.in/upload/advisories/2026/04/69f192d9de1dcDirection%20dt%2028.04.2026.pdf',
              'https://www.fssai.gov.in/upload/advisories/2026/06/6a2bc69152297Fruit%20Content%20Order.pdf',
              'https://www.fssai.gov.in/upload/advisories/2026/06/6a34f644db631Annexure%20No_part-2%20Compendium%20of%20Ayurveda%20Aahara%20recipes.pdf',
              'https://www.fssai.gov.in/upload/notifications/2026/04/69cca2b3f3ce9Notification%20dt%2024.03.2026_NRC.pdf',
              'https://fssai.gov.in/food-law/regulations/amendments/food-products-standards',
              'https://fssai.gov.in/food-law/regulations/amendments/contaminants-toxins',
              'https://fssai.gov.in/food-law/notifications?notification=ordinary-notification',
              'https://fssai.gov.in/food-law/notifications?notification=draft-notification',
              'https://stg-old.fssai.gov.in/advisories.php',
              'https://fcstraining.fssai.gov.in/standard-product'
          ]: add(url,'current-source-recheck')
          (out/'targets.json').write_text(json.dumps(targets,indent=2))
          def fetch(item):
              url,mods=item; ident=hashlib.sha256(url.encode()).hexdigest()[:18]
              result={'requested_url':url,'modules':mods,'captured_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'status':'FETCH_FAILED','regulatory_verified':False}
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (PMSV official-source audit)','Accept':'application/pdf,text/html,*/*'})
                  with urllib.request.urlopen(req,timeout=25) as response:
                      resolved=response.geturl(); host=urllib.parse.urlsplit(resolved).hostname or ''
                      if host!='fssai.gov.in' and not host.endswith('.fssai.gov.in'): raise ValueError('redirect outside FSSAI rejected')
                      data=response.read(30_000_001)
                      if len(data)>30_000_000: raise ValueError('source exceeds 30 MB capture bound')
                      result.update(resolved_url=resolved,content_type=response.headers.get('Content-Type',''),http_status=response.status)
                  ispdf=data[:5]==b'%PDF-'; ext='.pdf' if ispdf else '.html'
                  dest=out/(ident+ext); dest.write_bytes(data)
                  result.update(status='CAPTURED_PDF' if ispdf else 'CAPTURED_NON_PDF',file=dest.name,bytes=len(data),sha256=hashlib.sha256(data).hexdigest())
                  if ispdf and shutil.which('pdftotext'):
                      subprocess.run(['pdftotext','-layout',str(dest),str(out/(ident+'.txt'))],check=True,timeout=25)
                      text=(out/(ident+'.txt')).read_text(errors='replace')
                      result.update(text_file=ident+'.txt',text_characters=len(text),opening_text=text[:1600])
                  if not ispdf and '.pdf' in urllib.parse.urlsplit(url).path.lower(): result['status']='PDF_REQUEST_RETURNED_NON_PDF'
              except Exception as exc: result['error']=str(exc)[:600]
              return result
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool: results=list(pool.map(fetch,targets.items()))
          summary={'catalogue':533,'unique_ids':533,'source_targets':len(targets),'capture_results':dict(collections.Counter(x['status'] for x in results)),'scope':'Document capture and catalogue inventory only; no legal/compliance confirmation or deployment.','source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()}
          (out/'capture-manifest.json').write_text(json.dumps({'summary':summary,'sources':results},indent=2))
          (out/'product-master-v1.json').write_text(json.dumps(master,indent=2))
          print(json.dumps(summary,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: full533-official-source-capture-20261102
          path: full533-source-capture/
          retention-days: 3
          if-no-files-found: error
