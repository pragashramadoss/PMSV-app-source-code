name: Verify FSSAI Batch58 owner evidence outreach
on:
  push:
    branches: [gh-pages]
    paths:
      - 'fssai-product-helper-preview-01/fssai-current35-owner-outreach-batch58-2026-10-17.js'
      - 'tests/fssai-current35-owner-outreach-batch58-2026-10-17.test.cjs'
      - 'FSSAI-CURRENT35-BATCH58-OWNER-OUTREACH-2026-10-17.md'
      - 'fssai-product-helper-preview-01/index.html'
      - '.github/workflows/verify-fssai-current35-owner-outreach-batch58.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-batch58:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium test runner
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check new outreach panel JavaScript syntax
        run: node --check fssai-product-helper-preview-01/fssai-current35-owner-outreach-batch58-2026-10-17.js
      - name: Verify complete 35-case 175-request routing and preview browser
        run: node tests/fssai-current35-owner-outreach-batch58-2026-10-17.test.cjs
