name: Verify FSSAI Batch62 current FPSFA identity and supersession
on:
  push:
    branches: [gh-pages]
    paths:
      - 'fssai-product-helper-preview-01/data/rules/fssai-current35-identity-supersession-batch62-2026-10-17.json'
      - 'fssai-product-helper-preview-01/fssai-current35-identity-supersession-batch62-2026-10-17.js'
      - 'tests/fssai-current35-identity-supersession-batch62-2026-10-17.test.cjs'
      - 'FSSAI-CURRENT35-BATCH62-IDENTITY-SUPERSESSION-2026-10-17.md'
      - 'fssai-product-helper-preview-01/index.html'
      - '.github/workflows/verify-fssai-current35-identity-supersession-batch62.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-batch62:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate module and test syntax
        run: |
          node --check fssai-product-helper-preview-01/fssai-current35-identity-supersession-batch62-2026-10-17.js
          node --check tests/fssai-current35-identity-supersession-batch62-2026-10-17.test.cjs
      - name: Verify 6 precise FSSAI identity cautions, supersession, ancestry, no approval
        run: node tests/fssai-current35-identity-supersession-batch62-2026-10-17.test.cjs
