name: PMSV R58 Pan Masala product label packaging source guard
on:
  push:
    branches:
      - audit/all-533-2026-11-02
    paths:
      - 'fssai-helper/ctr-pan-masala-product-label-packaging-r58-2026-11-04.json'
      - 'fssai-helper/ctr-pan-masala-evidence-gate-r58-20261104.mjs'
      - 'scripts/test_ctr_pan_masala_r58_20261104.mjs'
      - '.github/workflows/verify-ctr-pan-masala-r58-20261104.yml'
  pull_request:
    branches:
      - gh-pages
    paths:
      - 'fssai-helper/ctr-pan-masala-product-label-packaging-r58-2026-11-04.json'
      - 'fssai-helper/ctr-pan-masala-evidence-gate-r58-20261104.mjs'
      - 'scripts/test_ctr_pan_masala_r58_20261104.mjs'
  workflow_dispatch:
jobs:
  verify-source-scopes-and-effective-dates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check 2.11.5, aflatoxin article separation, label and pack safeguards
        run: node scripts/test_ctr_pan_masala_r58_20261104.mjs
