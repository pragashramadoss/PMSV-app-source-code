name: Apply R9 fruit vegetable core corrections
on:
  push:
    branches: ['audit/all-533-2026-11-02']
    paths: ['.github/workflows/apply-fruit-vegetable-r9-core-20261103.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/audit/all-533-2026-11-02'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply preimage and output-hash checked corrections
        run: python3 scripts/apply_fruit_vegetable_r9_core_20261103.py
      - name: Commit only the three tested data files to audit branch
        shell: bash
        run: |
          test "${GITHUB_REF}" = 'refs/heads/audit/all-533-2026-11-02'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fssai-product-helper-preview-01/data/rules/chapter-2-3-fruit-vegetable-v1.json fssai-product-helper-preview-01/data/rules/appendix-b-v2-core.json fssai-product-helper-preview-01/data/product-master-v1.json
          git diff --cached --check
          git commit -m 'Restore juice table and restrict fruit microbiology exceptions with conditional routes'
          git push origin HEAD:refs/heads/audit/all-533-2026-11-02
      - uses: actions/upload-artifact@v4
        with:
          name: fruit-vegetable-r9-core-applied-20261103
          path: fruit-vegetable-r9-core-applied/
          retention-days: 3
          if-no-files-found: error
