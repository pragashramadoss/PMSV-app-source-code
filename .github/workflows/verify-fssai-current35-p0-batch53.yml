name: Verify FSSAI Batch53 thirteen P0 source and method exclusions
on:
  push:
    branches: [gh-pages]
    paths:
      - 'fssai-product-helper-preview-01/data/rules/fssai-current35-p0-thirteen-legal-method-evidence-batch53-2026-10-16.json'
      - 'fssai-product-helper-preview-01/fssai-current35-p0-thirteen-legal-method-evidence-batch53-2026-10-16.js'
      - 'tests/fssai-current35-p0-primary-ctr-method-batch53-2026-10-16.test.cjs'
      - 'fssai-product-helper-preview-01/index.html'
      - 'FSSAI-CURRENT35-BATCH53-THIRTEEN-P0-PRIMARY-CTR-METHOD-2026-10-16.md'
      - '.github/workflows/verify-fssai-current35-p0-batch53.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-batch53:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: JavaScript syntax
        run: node --check fssai-product-helper-preview-01/fssai-current35-p0-thirteen-legal-method-evidence-batch53-2026-10-16.js
      - name: Verify original-source comparators, 65 inherited evidence IDs, and browser controls
        run: node tests/fssai-current35-p0-primary-ctr-method-batch53-2026-10-16.test.cjs
