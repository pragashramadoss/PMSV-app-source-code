name: Verify four FSSAI named quality standards (Batch33)
on:
  push:
    branches: [gh-pages]
    paths:
      - 'fssai-product-helper-preview-01/data/rules/fssai-current35-four-sugar-lactose-tamarind-standards-batch33-2026-10-16.json'
      - 'fssai-product-helper-preview-01/fssai-current35-four-sugar-lactose-tamarind-standards-batch33-2026-10-16.js'
      - 'tests/fssai-current35-four-sugar-lactose-tamarind-standards-batch33-2026-10-16.test.cjs'
      - 'fssai-product-helper-preview-01/index.html'
      - '.github/workflows/verify-fssai-current35-four-product-standards-batch33.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-product-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium integration test
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate exact source UI script
        run: node --check fssai-product-helper-preview-01/fssai-current35-four-sugar-lactose-tamarind-standards-batch33-2026-10-16.js
      - name: Verify legal quality standards and guarded crosswalk in Chromium
        run: node tests/fssai-current35-four-sugar-lactose-tamarind-standards-batch33-2026-10-16.test.cjs
