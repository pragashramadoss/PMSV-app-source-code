name: Verify FSSAI Batch67 six source matrix cases
on:
  push:
    branches: [gh-pages]
    paths:
      - 'fssai-product-helper-preview-01/data/rules/fssai-current35-six-matrix-evidence-batch67-2026-10-17.json'
      - 'fssai-product-helper-preview-01/fssai-current35-six-matrix-evidence-batch67-2026-10-17.js'
      - 'tests/fssai-current35-six-matrix-evidence-batch67-2026-10-17.test.cjs'
      - 'FSSAI-CURRENT35-BATCH67-SIX-MATRIX-RESEARCH-2026-10-17.md'
      - '.github/workflows/verify-fssai-current35-matrix-batch67.yml'
      - 'fssai-product-helper-preview-01/index.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-six-matrix-batch67:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check source and test syntax
        run: |
          node --check fssai-product-helper-preview-01/fssai-current35-six-matrix-evidence-batch67-2026-10-17.js
          node --check tests/fssai-current35-six-matrix-evidence-batch67-2026-10-17.test.cjs
      - name: Check source lineage and browser controls
        run: node tests/fssai-current35-six-matrix-evidence-batch67-2026-10-17.test.cjs
