name: Verify operative egg and colostrum standards (Batch32)
on:
  push:
    branches: [gh-pages]
    paths:
      - 'fssai-product-helper-preview-01/data/rules/fssai-current35-egg-colostrum-gazette-batch32-2026-10-16.json'
      - 'fssai-product-helper-preview-01/fssai-current35-egg-colostrum-gazette-batch32-2026-10-16.js'
      - 'tests/fssai-current35-egg-colostrum-gazette-batch32-2026-10-16.test.cjs'
      - 'fssai-product-helper-preview-01/index.html'
      - '.github/workflows/verify-fssai-current35-egg-colostrum-amendment-batch32.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operative-gazette:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate Gazette UI script
        run: node --check fssai-product-helper-preview-01/fssai-current35-egg-colostrum-gazette-batch32-2026-10-16.js
      - name: Verify operative pH and IgG amendment in real browser
        run: node tests/fssai-current35-egg-colostrum-gazette-batch32-2026-10-16.test.cjs
