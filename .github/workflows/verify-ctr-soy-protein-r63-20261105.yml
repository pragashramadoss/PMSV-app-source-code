name: PMSV R63 soybean paste and vegetable protein FSSR source gate
on:
  push:
    branches:
      - audit/all-533-2026-11-02
    paths:
      - 'fssai-helper/ctr-soy-paste-vegetable-protein-r63-2026-11-05.json'
      - 'fssai-helper/ctr-soy-protein-source-gate-r63-20261105.mjs'
      - 'scripts/test_ctr_soy_protein_r63_20261105.mjs'
      - '.github/workflows/verify-ctr-soy-protein-r63-20261105.yml'
  pull_request:
    branches:
      - gh-pages
    paths:
      - 'fssai-helper/ctr-soy-paste-vegetable-protein-r63-2026-11-05.json'
      - 'fssai-helper/ctr-soy-protein-source-gate-r63-20261105.mjs'
      - 'scripts/test_ctr_soy_protein_r63_20261105.mjs'
  workflow_dispatch:
jobs:
  verify-2-source-scope-cases:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate 2 product source identities, nitrogen/dry-mass and 137 open holds
        run: node scripts/test_ctr_soy_protein_r63_20261105.mjs
