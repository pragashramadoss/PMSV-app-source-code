name: Verify FSSAI Batch68 twelve P1 lead source matrices
on:
  push:
    branches: [gh-pages]
    paths:
      - 'fssai-product-helper-preview-01/data/rules/fssai-current35-remaining12-p1-lead-batch68-2026-10-17.json'
      - 'fssai-product-helper-preview-01/fssai-current35-remaining12-p1-lead-batch68-2026-10-17.js'
      - 'tests/fssai-current35-remaining12-p1-lead-batch68-2026-10-17.test.cjs'
      - 'FSSAI-CURRENT35-BATCH68-REMAINING12-P1-LEAD-2026-10-17.md'
      - 'fssai-product-helper-preview-01/index.html'
      - '.github/workflows/verify-fssai-current35-p1-lead-batch68.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-batch68-isolated-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check JavaScript syntax
        run: |
          node --check fssai-product-helper-preview-01/fssai-current35-remaining12-p1-lead-batch68-2026-10-17.js
          node --check tests/fssai-current35-remaining12-p1-lead-batch68-2026-10-17.test.cjs
      - name: Verify 12 P1 matrices, exact parent lineage, source views and exports
        run: node tests/fssai-current35-remaining12-p1-lead-batch68-2026-10-17.test.cjs
