name: Verify PMSV Batch106 single-operation core validation cost
on:
  push:
    branches: [gh-pages]
    paths:
      - 'fssai-product-helper-preview-01/fssai-current35-review-draft-source-audit-batch20-2026-10-14.js'
      - 'fssai-product-helper-preview-01/fssai-current35-review-readiness-bridge-batch21-2026-10-14.js'
      - 'fssai-product-helper-preview-01/fssai-current35-browser-review-integrity-batch22-2026-10-14.js'
      - 'tests/pmsv-batch106-core-validation-cost.test.cjs'
      - '.github/workflows/verify-pmsv-batch106-core-validation-cost.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-core-source-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and per-operation validator count
        run: |
          node --check fssai-product-helper-preview-01/fssai-current35-review-draft-source-audit-batch20-2026-10-14.js
          node --check fssai-product-helper-preview-01/fssai-current35-review-readiness-bridge-batch21-2026-10-14.js
          node --check fssai-product-helper-preview-01/fssai-current35-browser-review-integrity-batch22-2026-10-14.js
          node tests/pmsv-batch106-core-validation-cost.test.cjs
      - name: Existing legal-source identity and drafting regressions
        run: |
          node --test tests/fssai-current35-review-draft-source-audit-batch20-2026-10-14.test.cjs
          node --test tests/fssai-current35-review-readiness-bridge-batch21-2026-10-14.test.cjs
          node tests/pmsv-batch105-core-readiness-handoff.test.cjs
          node tests/pmsv-batch104-event-dispatch-yield.test.cjs
          node tests/pmsv-batch103-verified-handoff.test.cjs
