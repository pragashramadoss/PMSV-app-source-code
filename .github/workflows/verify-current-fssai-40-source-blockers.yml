name: Verify current FSSAI 40 precise source blockers (fast)
on:
  push:
    branches: [gh-pages]
    paths:
      - 'fssai-product-helper-preview-01/**'
      - 'tests/fssai-current-40-source-blockers-2026-10-12.test.cjs'
      - '.github/workflows/verify-current-fssai-40-source-blockers.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify all 40 remaining official source evidence boundaries fail closed
        run: node --test tests/fssai-current-40-source-blockers-2026-10-12.test.cjs
      - name: Syntax-check legal source detail UI
        run: node --check fssai-product-helper-preview-01/fssai-current-40-source-blockers.js
