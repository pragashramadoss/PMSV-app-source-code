name: Verify current 35 CTR source intake (no regulatory PASS)
on:
  push:
    branches: [gh-pages]
    paths:
      - 'fssai-product-helper-preview-01/index.html'
      - 'fssai-product-helper-preview-01/fssai-current35-proof-intake-batch5-2026-10-13.js'
      - 'fssai-product-helper-preview-01/data/rules/fssai-current35-proof-intake-batch5-2026-10-13.json'
      - 'fssai-product-helper-preview-01/data/rules/fssai-current35-exact-ctr-article-gates-batch4-2026-10-13.json'
      - 'fssai-product-helper-preview-01/data/rules/fssai-current-first-source-533-live-ledger-498-35-2026-10-13.json'
      - 'fssai-product-helper-preview-01/data/rules/fssai-current-35-first-exact-source-proof-worklist-2026-10-13.json'
      - 'tests/fssai-current35-proof-intake-batch5-2026-10-13.test.cjs'
      - '.github/workflows/verify-fssai-current35-proof-intake-batch5.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify current 35 IDs and 140 original evidence receipt slots
        run: node --test tests/fssai-current35-proof-intake-batch5-2026-10-13.test.cjs
      - name: JavaScript syntax check
        run: node --check fssai-product-helper-preview-01/fssai-current35-proof-intake-batch5-2026-10-13.js
