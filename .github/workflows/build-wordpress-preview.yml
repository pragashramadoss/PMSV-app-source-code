name: Build WordPress production package

on:
  push:
    branches: [wordpress-production]
    paths:
      - 'app/**'
      - 'components/**'
      - 'data/**'
      - 'lib/**'
      - 'public/**'
      - 'vendor/**'
      - 'wordpress/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-wordpress-preview.yml'
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: wordpress-preview-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Check out PMSV audit source
        uses: actions/checkout@v4
        with:
          repository: pragashramadoss/pmsv-fssai-audit
          ref: main
          path: external-audit
          persist-credentials: false

      - name: Stage audit suite for WordPress
        run: |
          rm -rf public/audits
          mkdir -p public/audits
          rsync -a --exclude='.git' --exclude='.github' external-audit/ public/audits/
          rm -rf external-audit

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build WordPress production
        run: node wordpress/build.mjs

      - name: Verify WordPress package
        run: |
          test -f wordpress/plugin/pmsv-app.php
          test -f wordpress/plugin/routes.json
          test -f wordpress/plugin/assets/.vite/manifest.json
          test -f wordpress/plugin/public/audits/index.html
          test -f wordpress/plugin/public/audits/fssai-inspection-app.html
          test -f wordpress/plugin/public/audits/hygiene-rating-home.html
          test -f wordpress/plugin/public/audits/nc-management.html
          test -f wordpress/plugin/public/audits/hygiene-rating-nc-management.html
          test -f wordpress/plugin/public/audits/audit-forum.css
          for logo in qci.jpg sqf.svg australia.svg eu.svg india.png uk.png us.svg; do
            test -s "wordpress/plugin/public/logos/$logo"
          done
          for f in general-manufacturing milk-processing meat-processing fish-processing slaughter-house catering retail transport storage-warehouse; do
            grep -q 'pmsv-audit-deep' "wordpress/plugin/public/audits/$f.html"
            ! grep -q 'pmsv-audit-nav' "wordpress/plugin/public/audits/$f.html"
            grep -q 'audit-forum.css?v=35' "wordpress/plugin/public/audits/$f.html"
            grep -q 'checklist-ui.js?v=35' "wordpress/plugin/public/audits/$f.html"
            grep -q 'score-chip' "wordpress/plugin/public/audits/$f.html"
            grep -q 'Scoring Table' "wordpress/plugin/public/audits/$f.html"
            grep -q 'Rating / Grading Table' "wordpress/plugin/public/audits/$f.html"
            ! grep -q '<style>' "wordpress/plugin/public/audits/$f.html"
          done
          for f in hygiene-rating hygiene-rating-sweet-shop hygiene-rating-meat; do
            grep -q 'pmsv-audit-deep' "wordpress/plugin/public/audits/$f.html"
            ! grep -q 'pmsv-audit-nav' "wordpress/plugin/public/audits/$f.html"
            grep -q 'score-chip' "wordpress/plugin/public/audits/$f.html"
            grep -q 'Scoring Table' "wordpress/plugin/public/audits/$f.html"
            ! grep -q '<b>Scoring:</b>' "wordpress/plugin/public/audits/$f.html"
            grep -q 'Hygiene Rating' "wordpress/plugin/public/audits/$f.html"
            grep -q 'id="save"' "wordpress/plugin/public/audits/$f.html"
            grep -q 'id="reset"' "wordpress/plugin/public/audits/$f.html"
          done
          grep -q 'pmsv-audit-nav' wordpress/plugin/public/audits/index.html
          grep -q 'pmsv-audit-nav' wordpress/plugin/public/audits/fssai-inspection-app.html
          grep -q 'pmsv-audit-nav' wordpress/plugin/public/audits/hygiene-rating-home.html
          grep -q 'Updates/News' wordpress/plugin/public/audits/index.html
          grep -q 'Audits' wordpress/plugin/public/audits/index.html
          grep -q 'Blogs' wordpress/plugin/public/audits/index.html
          ! grep -q 'class="tile hygiene"' wordpress/plugin/public/audits/index.html
          ! grep -q 'class="action primary"' wordpress/plugin/public/audits/fssai-inspection-app.html
          ! grep -q 'class="action nc"' wordpress/plugin/public/audits/fssai-inspection-app.html
          test "$(grep -o '</script>' wordpress/plugin/public/audits/audit-report.html | wc -l | tr -d ' ')" -eq 1
          ! grep -q "location.hostname!=='raw.githack.com'" wordpress/plugin/public/audits/audit-report.html
          grep -q 'const scoreValue=' wordpress/plugin/public/audits/audit-report.html
          grep -q 'function downloadWord()' wordpress/plugin/public/audits/audit-report.html
          grep -q 'function downloadExcel()' wordpress/plugin/public/audits/audit-report.html
          grep -q 'function downloadPDF()' wordpress/plugin/public/audits/audit-report.html
          grep -q 'grid-template-areas:"no question" "max status" "comment comment"' wordpress/plugin/public/audits/audit-forum.css
          grep -q 'overflow:hidden!important;white-space:nowrap!important' wordpress/plugin/public/audits/audit-forum.css
          grep -q 'overflow-x:clip!important' wordpress/plugin/public/audits/audit-forum.css
          grep -q 'position:-webkit-sticky!important' wordpress/plugin/public/audits/audit-forum.css
          ! grep -R -q '/wp-content/plugins/pmsv-original-app-preview/public/' wordpress/plugin/assets/assets/*.js
          grep -R -q 'logos/qci.jpg' wordpress/plugin/assets/assets/*.js
          grep -R -q 'logos/sqf.svg' wordpress/plugin/assets/assets/*.js
          test "$(grep -Rho 'data:image/webp;base64,' wordpress/plugin/assets/assets/*.js | wc -l | tr -d ' ')" -ge 10
          ! grep -REq 'logos/(asq|cqi-irca|efqm|lei|fssc|brcgs|iso|ifs|aib)\.(ico|svg|png|jpg|jpeg)' wordpress/plugin/assets/assets/*.js
          ! test -e wordpress/plugin/public/logos/official-logo-status.json
          for stale in asq cqi-irca efqm lei fssc brcgs iso ifs aib; do
            ! test -e "wordpress/plugin/public/logos/$stale.ico"
            ! test -e "wordpress/plugin/public/logos/$stale.svg"
          done
          ! grep -R -Ei 'chatgpt\.site|chatgpt\.com|openai\.com|modelContext' wordpress/plugin
          grep -q '"/updates"' wordpress/plugin/routes.json
          grep -q '"/about"' wordpress/plugin/routes.json
          grep -R -q 'AC Tech, Anna University' wordpress/plugin/assets/assets/*.js
          grep -R -q 'pragash-profile.jpg' wordpress/plugin/assets/assets/*.js

      - name: Sync generated plugin files to migration branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wordpress/plugin
          if ! git diff --cached --quiet; then
            git commit -m "Build WordPress production 1.0.5 [skip ci]"
            git push origin HEAD:wordpress-production
          fi

      - name: Package plugin
        run: |
          rm -rf dist-wordpress
          mkdir -p dist-wordpress/pmsv-original-app-preview
          cp -R wordpress/plugin/. dist-wordpress/pmsv-original-app-preview/
          cd dist-wordpress
          zip -qr ../PMSV-Food-Safety-Quality-Forum-v1.0.5.zip pmsv-original-app-preview

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PMSV-Food-Safety-Quality-Forum-v1.0.5
          path: PMSV-Food-Safety-Quality-Forum-v1.0.5.zip
          if-no-files-found: error
          retention-days: 14

