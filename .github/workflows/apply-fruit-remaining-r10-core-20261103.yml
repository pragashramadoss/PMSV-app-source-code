name: Apply R10 remaining fruit vegetable core review
on:
  push:
    branches: ['audit/all-533-2026-11-02']
    paths: ['.github/workflows/apply-fruit-remaining-r10-core-20261103.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/audit/all-533-2026-11-02'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply preimage and output-hash checked source corrections
        run: python3 scripts/apply_fruit_remaining_r10_core_20261103.py
      - name: Commit only selected core file and review index to audit branch
        shell: bash
        run: |
          test "${GITHUB_REF}" = 'refs/heads/audit/all-533-2026-11-02'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fssai-product-helper-preview-01/data/rules/chapter-2-3-fruit-vegetable-v1.json fssai-helper/fruit-vegetable-r10-review-index-2026-11-03.json
          git diff --cached --check
          git commit -m 'Restore vanilla ash and scoped container, oil-basis and defect controls for R10'
          git push origin HEAD:refs/heads/audit/all-533-2026-11-02
      - uses: actions/upload-artifact@v4
        with:
          name: fruit-remaining-r10-core-applied-20261103
          path: fruit-remaining-r10-applied/
          retention-days: 3
          if-no-files-found: error
