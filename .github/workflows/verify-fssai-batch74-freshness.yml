name: Verify FSSAI Batch74 ready-state freshness
on:
  push:
    branches: [gh-pages]
    paths:
      - 'fssai-product-helper-preview-01/fssai-current35-core-startup-batch70-2026-10-17.js'
      - 'tests/fssai-batch74-freshness-gates.test.cjs'
      - '.github/workflows/verify-fssai-batch74-freshness.yml'
      - 'FSSAI-CURRENT35-BATCH74-FRESHNESS-2026-10-17.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verified-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Syntax verification
        run: |
          node --check fssai-product-helper-preview-01/fssai-current35-core-startup-batch70-2026-10-17.js
          node --check tests/fssai-batch74-freshness-gates.test.cjs
      - name: Verify source freshness and invalid approval safeguards
        run: node tests/fssai-batch74-freshness-gates.test.cjs
      - name: Verify 35 HELD / 175 original evidence gates
        run: node tests/fssai-current35-batch69-all35-source-coverage.test.cjs
      - name: Validate complete real-browser opt-in B58-B68 integration
        run: node tests/fssai-batch73-full-review.test.cjs
        timeout-minutes: 9
