name: Verify PMSV Batch90 533 product-checker source bridge
on:
  push:
    branches: [gh-pages]
    paths:
      - 'fssai-product-helper-preview-01/fssai-final35-legal-review-2026-10-18.js'
      - 'tests/pmsv-batch90-product-checker-bridge.test.cjs'
      - 'tests/pmsv-batch87-533-browser.test.cjs'
      - '.github/workflows/verify-pmsv-batch90-product-checker-bridge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate all 533 main-product identities and no-pass bridge
        run: |
          node --check fssai-product-helper-preview-01/fssai-final35-legal-review-2026-10-18.js
          node tests/pmsv-batch90-product-checker-bridge.test.cjs
          node tests/pmsv-batch89-live-source-closure.test.cjs
          node tests/pmsv-batch87-533-integrity.test.cjs
