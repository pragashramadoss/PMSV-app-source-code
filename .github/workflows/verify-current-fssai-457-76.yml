name: Verify current FSSAI 457/76 first sources (fast)
on:
  push:
    branches: [gh-pages]
    paths:
      - 'fssai-product-helper-preview-01/**'
      - 'tests/fssai-first-source-current-457-76-2026-10-12.test.cjs'
      - '.github/workflows/verify-current-fssai-457-76.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify 457/76 current first source status, HBC, crop and colour scope
        run: node --test tests/fssai-first-source-current-457-76-2026-10-12.test.cjs
      - name: Syntax-check current source and legacy future-date panels
        run: |
          node --check fssai-product-helper-preview-01/fssai-first-source-current-457-76.js
          node --check fssai-product-helper-preview-01/fssai-first-source-current-450-83.js
          node --check fssai-product-helper-preview-01/fssai-2026-may-533-89-effective-date.js
