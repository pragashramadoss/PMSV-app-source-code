name: Verify PMSV Batch102 single-pass evidence-review source validation
on:
  push:
    branches: [gh-pages]
    paths:
      - 'fssai-product-helper-preview-01/pmsv-batch98-source-authentication-handoff-2026-10-25.js'
      - 'fssai-product-helper-preview-01/pmsv-batch99-downstream-evidence-dependency-audit-2026-10-25.js'
      - 'fssai-product-helper-preview-01/pmsv-batch100-independent-review-exception-register-2026-10-25.js'
      - 'tests/pmsv-batch102-single-pass-evidence-guards.test.cjs'
      - '.github/workflows/verify-pmsv-batch102-single-pass-evidence-guards.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-duplicated-expensive-source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify single-pass source validation, freshness and original HELD state
        run: node tests/pmsv-batch102-single-pass-evidence-guards.test.cjs
      - name: Regression source revision history
        run: node tests/pmsv-batch98-source-handoff.test.cjs
      - name: Regression downstream evidence dependencies
        run: node tests/pmsv-batch99-downstream-audit.test.cjs
      - name: Regression independent issue register
        run: node tests/pmsv-batch100-reviewer-exceptions.test.cjs
      - name: Regression independent reviewer navigation
        run: node tests/pmsv-batch101-reviewer-navigation.test.cjs
