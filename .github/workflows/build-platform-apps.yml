name: PMSV desktop and iPhone bundles
on:
  push:
    branches: ['platform/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: Windows x64, os: windows-latest, platform: win, arch: x64}
          - {label: Mac Apple Silicon, os: macos-26, platform: mac, arch: arm64}
          - {label: Mac Intel, os: macos-26-intel, platform: mac, arch: x64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: 'platforms/package-lock.json'}
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix platforms --no-audit --no-fund
      - run: npm run --prefix platforms build:web && npm test --prefix platforms
      - name: Build installer
        working-directory: platforms
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Install Windows package and test
        if: matrix.platform == 'win'
        shell: pwsh
        working-directory: platforms
        run: |
          $installer = (Get-ChildItem release -Filter '*.exe')[0].FullName
          $target = Join-Path $env:RUNNER_TEMP 'PMSVInstall'
          $process = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$target") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $env:PMSV_EXECUTABLE = Join-Path $target 'PMSV.exe'
          if (-not (Test-Path $env:PMSV_EXECUTABLE)) { throw 'Installed application is missing' }
          node tests/desktop-smoke.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Installed Windows app verification failed' }
      - name: Mount Mac package and test
        if: matrix.platform == 'mac'
        working-directory: platforms
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/PMSV-mount"
          hdiutil attach release/*.dmg -nobrowse -mountpoint "$RUNNER_TEMP/PMSV-mount"
          ditto "$RUNNER_TEMP/PMSV-mount/PMSV.app" "$RUNNER_TEMP/PMSV.app"
          hdiutil detach "$RUNNER_TEMP/PMSV-mount"
          codesign --verify --deep --strict "$RUNNER_TEMP/PMSV.app"
          PMSV_EXECUTABLE="$RUNNER_TEMP/PMSV.app/Contents/MacOS/PMSV" node tests/desktop-smoke.mjs
      - name: Package notes and checksums
        if: success()
        working-directory: platforms
        run: |
          cp README.md release/README.md
          node scripts/checksums.mjs release
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: PMSV-2.2.0-${{ matrix.platform }}-${{ matrix.arch }}-Preview
          path: |
            platforms/release/*.exe
            platforms/release/*.dmg
            platforms/release/README.md
            platforms/release/SHA256SUMS.txt
          compression-level: 0
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PMSV-QA-${{ matrix.platform }}-${{ matrix.arch }}
          path: platforms/test-results/
          retention-days: 14
  iphone:
    name: iPhone archive and simulator tests
    runs-on: macos-26
    timeout-minutes: 40
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: 'platforms/package-lock.json'}
      - run: npm ci --no-audit --no-fund && npm ci --prefix platforms --no-audit --no-fund
      - run: npm run --prefix platforms build:web
      - run: npx cap sync ios
        working-directory: platforms
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: platforms/ios/App
      - name: Build iPhone archive
        working-directory: platforms/ios/App
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/PMSV-2.2.0.xcarchive" CODE_SIGNING_ALLOWED=NO archive > "$RUNNER_TEMP/iphone-build.log" 2>&1 || { tail -150 "$RUNNER_TEMP/iphone-build.log"; exit 1; }
      - name: Test bundled tools in iPhone simulator
        working-directory: platforms/ios/App
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for runtime,devices in d["devices"].items() if "iOS" in runtime for x in devices if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug -destination "id=$device" -derivedDataPath "$RUNNER_TEMP/PMSVDerived" -resultBundlePath "$RUNNER_TEMP/PMSV-iPhone-QA.xcresult" CODE_SIGNING_ALLOWED=NO test > "$RUNNER_TEMP/iphone-test.log" 2>&1 || { tail -150 "$RUNNER_TEMP/iphone-test.log"; exit 1; }
      - name: Prepare signing handoff and simulator bundles
        working-directory: platforms
        run: |
          set -euo pipefail
          mkdir -p release handoff/PMSV-iPhone-2.2.0
          ditto "$RUNNER_TEMP/PMSV-2.2.0.xcarchive" handoff/PMSV-iPhone-2.2.0/PMSV-2.2.0.xcarchive
          ditto ios handoff/PMSV-iPhone-2.2.0/ios
          cp README.md handoff/PMSV-iPhone-2.2.0/README.md
          cp package.json package-lock.json capacitor.config.json handoff/PMSV-iPhone-2.2.0/
          ditto -c -k --keepParent handoff/PMSV-iPhone-2.2.0 release/PMSV-2.2.0-iPhone-Signing-Package.zip
          ditto -c -k --keepParent "$RUNNER_TEMP/PMSVDerived/Build/Products/Debug-iphonesimulator/PMSV.app" release/PMSV-2.2.0-iPhone-Simulator.zip
          node scripts/checksums.mjs release
      - name: Export iPhone screenshots
        if: always()
        run: |
          mkdir -p platforms/test-results
          cp "$RUNNER_TEMP"/iphone-*.log platforms/test-results/ || true
          if [ -d "$RUNNER_TEMP/PMSV-iPhone-QA.xcresult" ]; then xcrun xcresulttool export attachments --path "$RUNNER_TEMP/PMSV-iPhone-QA.xcresult" --output-path platforms/test-results/attachments || true; fi
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: PMSV-2.2.0-iPhone-Signing-Package
          path: platforms/release/
          compression-level: 0
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PMSV-QA-iPhone
          path: platforms/test-results/
          retention-days: 14
