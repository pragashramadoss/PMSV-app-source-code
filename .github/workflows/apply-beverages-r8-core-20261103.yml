name: Apply R8 beverage core corrections
on:
  push:
    branches: ['audit/all-533-2026-11-02']
    paths: ['.github/workflows/apply-beverages-r8-core-20261103.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/audit/all-533-2026-11-02'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply preimage and output-hash checked corrections
        run: python3 scripts/apply_beverages_r8_core_20261103.py
      - name: Commit only the corrected chapter module on audit branch
        shell: bash
        run: |
          test "${GITHUB_REF}" = 'refs/heads/audit/all-533-2026-11-02'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fssai-product-helper-preview-01/data/rules/chapter-2-10-beverages-v1.json
          git diff --cached --check
          git commit -m 'Reconcile R8 beverage source limits, water omissions and explicit scope questions'
          git push origin HEAD:refs/heads/audit/all-533-2026-11-02
      - uses: actions/upload-artifact@v4
        with:
          name: beverages-r8-core-applied-20261103
          path: beverages-r8-core-applied/
          retention-days: 3
          if-no-files-found: error
