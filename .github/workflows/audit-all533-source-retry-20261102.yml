name: Full 533 source recovery
on:
  push:
    branches: ['audit/all-533-2026-11-02']
    paths: ['.github/workflows/audit-all533-source-retry-20261102.yml']
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Recover primary sources
        run: |
          python3 - <<'PY'
          import json,pathlib,urllib.request,urllib.parse,concurrent.futures,hashlib,datetime,subprocess,re
          root=pathlib.Path('fssai-product-helper-preview-01/data/rules'); out=pathlib.Path('source-recovery');out.mkdir()
          targets={}
          def walk(x,mod):
              if isinstance(x,dict):
                  for k,v in x.items(): walk(v,mod)
              elif isinstance(x,list):
                  for v in x: walk(v,mod)
              elif isinstance(x,str) and x.startswith('https://'):
                  h=urllib.parse.urlsplit(x).hostname or ''
                  if (h=='fssai.gov.in' or h.endswith('.fssai.gov.in')) and ('.pdf' in x.lower()): targets.setdefault(x,[]).append(mod)
          for name in ['chapter-2-1-dairy-v1.json','chapter-2-5-meat-eggs-v1.json','foods-for-infant-nutrition-v2.json','chapter-3-substances-added-v1.json','appendix-c-v2-core.json','labelling-display-v8-core.json','packaging-current-core.json','advertising-claims-v4-core.json','special-regulatory-routes-v1.json']:
              walk(json.loads((root/name).read_text()),name)
          # The official lists are retained as listings, never interpreted as approval.
          for u in ['https://fssai.gov.in/food-law/regulations/amendments/food-products-standards','https://fssai.gov.in/food-law/regulations/amendments/contaminants-toxins','https://stg-old.fssai.gov.in/notifications.php?pages=1','https://www.fssai.gov.in/upload/advisories/2026/04/69f192d9de1dcDirection%20dt%2028.04.2026.pdf','https://www.fssai.gov.in/upload/uploadfiles/files/Comp_IFR_VERSION-II_04_01_2024.pdf','https://www.fssai.gov.in/upload/uploadfiles/files/2_%20Chapter%202_1%20(Dairy%20products%20and%20analogues).pdf','https://www.fssai.gov.in/upload/uploadfiles/files/Chapter%202_5_Meat%20and%20Meat%20products%281%29.pdf']:
              targets.setdefault(u,[]).append('missing-primary-source-recovery')
          (out/'targets.json').write_text(json.dumps(targets,indent=2))
          def fetch(item):
              u,mods=item; row={'requested_url':u,'modules':sorted(set(mods)),'regulatory_verified':False,'captured_at':datetime.datetime.now(datetime.timezone.utc).isoformat()};ident=hashlib.sha256(u.encode()).hexdigest()[:18]
              attempts=[u]
              if urllib.parse.urlsplit(u).hostname in ['fssai.gov.in','www.fssai.gov.in']:
                  attempts.append(u.replace('https://fssai.gov.in/','https://www.fssai.gov.in/') if 'https://fssai.gov.in/' in u else u.replace('https://www.fssai.gov.in/','https://fssai.gov.in/'))
              for url in attempts:
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/pdf,text/html,*/*'})
                      with urllib.request.urlopen(req,timeout=50) as res:
                          data=res.read(30_000_001);resolved=res.geturl();host=urllib.parse.urlsplit(resolved).hostname or ''
                          if host!='fssai.gov.in' and not host.endswith('.fssai.gov.in'):raise ValueError('non-FSSAI redirect')
                          if len(data)>30_000_000:raise ValueError('size bound')
                      ispdf=data.startswith(b'%PDF-');ext='.pdf' if ispdf else '.html';dest=out/(ident+ext);dest.write_bytes(data)
                      row.update(status='CAPTURED_PDF' if ispdf else 'CAPTURED_NON_PDF',file=dest.name,resolved_url=resolved,fetch_url=url,sha256=hashlib.sha256(data).hexdigest(),bytes=len(data))
                      if ispdf:
                          subprocess.run(['pdftotext','-layout',str(dest),str(out/(ident+'.txt'))],check=True,timeout=25)
                          row['text_file']=ident+'.txt'
                      return row
                  except Exception as e:row.update(status='FETCH_FAILED',error=str(e)[:500])
              return row
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:rows=list(pool.map(fetch,targets.items()))
          from collections import Counter
          summary={'source_targets':len(rows),'results':dict(Counter(r['status'] for r in rows)),'scope':'Capture only; document contents and operative dates require separate review'}
          (out/'capture-manifest.json').write_text(json.dumps({'summary':summary,'sources':rows},indent=2));print(json.dumps(summary))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: full533-official-source-recovery-20261102
          path: source-recovery/
          retention-days: 3
          if-no-files-found: error
