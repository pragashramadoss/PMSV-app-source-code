name: Apply R14 final route source review
on:
  push:
    branches: ['audit/all-533-2026-11-02']
    paths: ['.github/workflows/apply-routes-r14-core-20261103.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/audit/all-533-2026-11-02'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact preimage/output-hash checked route metadata
        run: python3 scripts/apply_routes_r14_core_20261103.py
      - name: Commit only reviewed metadata on audit branch
        shell: bash
        run: |
          test "${GITHUB_REF}" = 'refs/heads/audit/all-533-2026-11-02'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fssai-product-helper-preview-01/data/rules/special-regulatory-routes-v1.json fssai-product-helper-preview-01/data/product-master-v1.json
          git diff --cached --check
          git commit -m 'Complete R14 scoped review metadata for final 40 regulatory routes'
          git push origin HEAD:refs/heads/audit/all-533-2026-11-02
      - uses: actions/upload-artifact@v4
        with:
          name: routes-r14-core-applied-20261103
          path: routes-r14-core-applied/
          retention-days: 3
          if-no-files-found: error
