name: Verify PMSV Batch116 35-case owner handoff
on:
  push:
    branches: [gh-pages]
    paths:
      - 'fssai-product-helper-preview-01/index.html'
      - 'fssai-product-helper-preview-01/fssai-current35-owner-outreach-batch58-2026-10-17.js'
      - 'fssai-product-helper-preview-01/pmsv-batch116-owner-handoff-2026-10-27.js'
      - 'tests/pmsv-batch116-owner-handoff.test.cjs'
      - '.github/workflows/verify-pmsv-batch116-owner-handoff.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner-handoff-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JS syntax and 35-case owner packet integrity
        run: |
          node --check fssai-product-helper-preview-01/fssai-current35-owner-outreach-batch58-2026-10-17.js
          node --check fssai-product-helper-preview-01/pmsv-batch116-owner-handoff-2026-10-27.js
          node --test tests/pmsv-batch116-owner-handoff.test.cjs
          node --test tests/fssai-current-111-decision-gates-2026-10-12.test.cjs
