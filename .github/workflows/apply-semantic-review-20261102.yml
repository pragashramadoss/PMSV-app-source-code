name: Apply reviewed numeric source corrections
on:
  push:
    branches: ['audit/all-533-2026-11-02']
    paths: ['.github/workflows/apply-semantic-review-20261102.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/audit/all-533-2026-11-02'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply preimage-checked corrections and validate results
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,gzip,json,pathlib,hashlib,subprocess
          # Compressed JSON patch operations, not executable payload. Hash and exact paths checked.
          encoded=''
          raw=gzip.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(raw).hexdigest()=='dabf9cff071733e6e0e8206de581fca7236e5f7961cc7b0db7fbf74b0d26facb'
          patches=json.loads(raw)
          allowed={'fssai-product-helper-preview-01/data/rules/chapter-2-7-sweets-confectionery-v1.json','fssai-product-helper-preview-01/data/rules/chapter-2-8-sweetening-honey-v1.json'}
          assert len(patches)==2 and {p['path'] for p in patches}==allowed
          out=pathlib.Path('semantic-application-results');out.mkdir()
          manifest=[]
          for patch in patches:
              p=pathlib.Path(patch['path'])
              assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip()==patch['before_git_blob'],'Source changed; reconcile before applying'
              d=json.loads(p.read_text())
              for op in patch['operations']:
                  target=d
                  for k in op['path'][:-1]:target=target[k]
                  key=op['path'][-1]
                  if op['op']=='set':target[key]=op['value']
                  elif op['op']=='remove':del target[key]
                  else:raise ValueError('unsupported operation')
              content=(json.dumps(d,ensure_ascii=False,indent=2)+'\n').encode()
              assert hashlib.sha256(content).hexdigest()==patch['after_sha256'],'Generated module differs from locally tested content'
              assert all(s['source_content_review']['current_law_complete'] is False and s['source_content_review']['commercial_release_authorized'] is False for s in d['standards'])
              p.write_bytes(content);(out/p.name).write_bytes(content)
              manifest.append({'path':str(p),'sha256':patch['after_sha256'],'standards':len(d['standards'])})
          assert sum(x['standards'] for x in manifest)==28
          master=json.loads(pathlib.Path('fssai-product-helper-preview-01/data/product-master-v1.json').read_text())
          assert len(master['catalog_products'])==533
          assert len({p['id'] for p in master['catalog_products']})==533
          standards={s['key']:s for p in allowed for s in json.loads(pathlib.Path(p).read_text())['standards']}
          assert all(v['crude_fibre_max_pct_moisture_fat_free']==7 for v in standards['2.7.7']['variants'])
          assert all(t['acid_insoluble_ash_basis']=='moisture-, fat- and sugar-free' for t in standards['2.7.4']['chocolate_types'] if 'acid_insoluble_ash_max_pct' in t)
          assert sum(bool(s['source_content_review']['source_questions']) for s in standards.values())==4
          (out/'application-manifest.json').write_text(json.dumps({'scope':'Applied content is byte-identical to locally tested modules; source-edition review only, no full-law or lot approval.','modules':manifest,'catalogue':533,'standards':28,'source_question_standards':4},indent=2))
          print(json.dumps(manifest,indent=2))
          PY
      - name: Commit reviewed modules to audit branch only
        shell: bash
        run: |
          test "${GITHUB_REF}" = 'refs/heads/audit/all-533-2026-11-02'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fssai-product-helper-preview-01/data/rules/chapter-2-7-sweets-confectionery-v1.json fssai-product-helper-preview-01/data/rules/chapter-2-8-sweetening-honey-v1.json
          git diff --cached --check
          git commit -m 'Reconcile 28 source standards: cocoa fibre, analytical bases and explicit subtype conditions'
          git push origin HEAD:refs/heads/audit/all-533-2026-11-02
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-review-applied-20261102
          path: semantic-application-results/
          retention-days: 3
          if-no-files-found: error
