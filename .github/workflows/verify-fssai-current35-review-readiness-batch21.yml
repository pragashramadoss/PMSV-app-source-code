name: Verify FSSAI current35 evidence-readiness bridge Batch21
on:
  push:
    branches: [gh-pages]
    paths:
      - 'fssai-product-helper-preview-01/data/rules/fssai-current35-review-readiness-bridge-batch21-2026-10-14.json'
      - 'fssai-product-helper-preview-01/fssai-current35-review-readiness-bridge-batch21-2026-10-14.js'
      - 'tests/fssai-current35-review-readiness-bridge-batch21-2026-10-14.test.cjs'
      - 'fssai-product-helper-preview-01/index.html'
      - '.github/workflows/verify-fssai-current35-review-readiness-batch21.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test 35-case reviewer readiness and import refresh
        run: node --test tests/fssai-current35-review-readiness-bridge-batch21-2026-10-14.test.cjs
      - name: Verify source JavaScript syntax
        run: node --check fssai-product-helper-preview-01/fssai-current35-review-readiness-bridge-batch21-2026-10-14.js
