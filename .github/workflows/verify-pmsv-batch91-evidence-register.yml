name: Verify PMSV Batch91 175 original evidence register
on:
  push:
    branches: [gh-pages]
    paths:
      - 'fssai-product-helper-preview-01/pmsv-batch91-evidence-register-2026-10-20.js'
      - 'fssai-product-helper-preview-01/index.html'
      - 'tests/pmsv-batch91-evidence-register.test.cjs'
      - 'tests/pmsv-batch91-evidence-register-browser.test.cjs'
      - '.github/workflows/verify-pmsv-batch91-evidence-register.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-evidence-register:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source integrity and JavaScript
        run: |
          node --check fssai-product-helper-preview-01/pmsv-batch91-evidence-register-2026-10-20.js
          node tests/pmsv-batch91-evidence-register.test.cjs
          node tests/pmsv-batch90-product-checker-bridge.test.cjs
          node tests/pmsv-batch89-live-source-closure.test.cjs
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Mobile 390px evidence import and integrity regression
        run: node tests/pmsv-batch91-evidence-register-browser.test.cjs
