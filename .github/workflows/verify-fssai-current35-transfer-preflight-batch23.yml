name: Verify PMSV FSSAI cross-device evidence transfer in Chromium (Batch23)
on:
  push:
    branches: [gh-pages]
    paths:
      - 'fssai-product-helper-preview-01/fssai-current35-transfer-preflight-batch23-2026-10-14.js'
      - 'tests/fssai-current35-transfer-preflight-batch23-2026-10-14.test.cjs'
      - 'fssai-product-helper-preview-01/index.html'
      - '.github/workflows/verify-fssai-current35-transfer-preflight-batch23.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ephemeral Chromium test browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check source syntax
        run: node --check fssai-product-helper-preview-01/fssai-current35-transfer-preflight-batch23-2026-10-14.js
      - name: Test real file preview, rejection and explicit restoration consent
        run: node tests/fssai-current35-transfer-preflight-batch23-2026-10-14.test.cjs
