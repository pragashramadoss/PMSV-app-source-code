name: Verify FSSAI Batch60 remaining20 operative-text scope
on:
  push:
    branches: [gh-pages]
    paths:
      - 'fssai-product-helper-preview-01/data/rules/fssai-current35-remaining20-legal-scope-review-batch60-2026-10-17.json'
      - 'fssai-product-helper-preview-01/fssai-current35-remaining20-legal-scope-review-batch60-2026-10-17.js'
      - 'fssai-product-helper-preview-01/fssai-current35-reference-row-nontransfer-batch59-2026-10-17.js'
      - 'tests/fssai-current35-remaining20-legal-scope-batch60-2026-10-17.test.cjs'
      - 'FSSAI-CURRENT35-BATCH60-REMAINING20-OPERATIVE-SOURCE-SCOPE-2026-10-17.md'
      - 'fssai-product-helper-preview-01/index.html'
      - '.github/workflows/verify-fssai-current35-remaining20-batch60.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-batch60:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check Batch59 and Batch60 loader syntax
        run: |
          node --check fssai-product-helper-preview-01/fssai-current35-reference-row-nontransfer-batch59-2026-10-17.js
          node --check fssai-product-helper-preview-01/fssai-current35-remaining20-legal-scope-review-batch60-2026-10-17.js
      - name: Verify 20 source-scope dossiers, exact Batch59 lineage and immutable holds
        run: node tests/fssai-current35-remaining20-legal-scope-batch60-2026-10-17.test.cjs
