name: PMSV R67 RTE curried vegetables source-only no-inheritance
on:
  push:
    branches: [audit/all-533-2026-11-02]
    paths:
      - 'fssai-helper/ctr-rte-curried-vegetables-r67-2026-11-11.json'
      - 'fssai-helper/ctr-rte-curried-vegetables-source-gate-r67-20261111.mjs'
      - 'scripts/test_ctr_rte_curried_vegetables_r67_20261111.mjs'
      - '.github/workflows/verify-ctr-rte-curried-vegetables-r67-20261111.yml'
  pull_request:
    branches: [gh-pages]
  workflow_dispatch:
jobs:
  verify-source-not-approval:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test_ctr_rte_curried_vegetables_r67_20261111.mjs
