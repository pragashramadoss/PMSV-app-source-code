name: Verify current FSSAI 8 additional quality-only dossiers
on:
  push:
    branches: [gh-pages]
    paths:
      - 'fssai-product-helper-preview-01/**'
      - 'tests/fssai-current-eight-more-quality-source-only-2026-10-12.test.cjs'
      - '.github/workflows/verify-current-fssai-quality8.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test eight pending FSSR finished quality sources
        run: node --test tests/fssai-current-eight-more-quality-source-only-2026-10-12.test.cjs
      - name: Check source syntax
        run: node --check fssai-product-helper-preview-01/fssai-current-eight-more-quality-source-only.js
