    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify 2023 cane jaggery lower bound and no product PASS
        run: node scripts/test_ctr_sweeteners_r60_20261105.mjs
