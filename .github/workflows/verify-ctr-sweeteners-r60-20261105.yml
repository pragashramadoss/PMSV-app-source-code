      - 'fssai-helper/ctr-sweeteners-six-source-review-r60-2026-11-05.json'
      - 'fssai-helper/ctr-sweeteners-source-gate-r60-20261105.mjs'
      - 'scripts/test_ctr_sweeteners_r60_20261105.mjs'
      - '.github/workflows/verify-ctr-sweeteners-r60-20261105.yml'
