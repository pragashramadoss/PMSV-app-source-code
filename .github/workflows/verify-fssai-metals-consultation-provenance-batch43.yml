name: Verify signed FSSAI consultation provenance and safe manual holds (Batch43)
on:
  push:
    branches: [gh-pages]
    paths:
      - 'fssai-product-helper-preview-01/data/rules/fssai-current35-metals-consultation-provenance-batch43-2026-10-16.json'
      - 'fssai-product-helper-preview-01/fssai-current35-metals-consultation-provenance-batch43-2026-10-16.js'
      - 'tests/fssai-current35-metals-consultation-provenance-batch43-2026-10-16.test.cjs'
      - 'fssai-product-helper-preview-01/index.html'
      - '.github/workflows/verify-fssai-metals-consultation-provenance-batch43.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-batch43:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium for consultation provenance regression
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check Batch43 preview JavaScript syntax
        run: node --check fssai-product-helper-preview-01/fssai-current35-metals-consultation-provenance-batch43-2026-10-16.js
      - name: Test consultation status, 7 conflicts, 27 holds and 140-row CSV in Chromium
        run: node tests/fssai-current35-metals-consultation-provenance-batch43-2026-10-16.test.cjs
