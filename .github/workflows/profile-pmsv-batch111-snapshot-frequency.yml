name: PMSV Batch111 measure snapshot validation frequency
on:
  push:
    branches: [gh-pages]
    paths:
      - 'tests/pmsv-batch111-snapshot-frequency.test.cjs'
      - '.github/workflows/profile-pmsv-batch111-snapshot-frequency.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot-frequency:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Integrity and syntax guards
        run: |
          node --check tests/pmsv-batch111-snapshot-frequency.test.cjs
          node tests/pmsv-batch110-snapshot-string-cache.test.cjs
          node tests/fssai-681-review-snapshot-and-historic-queue-2026-10-12.test.cjs
          node tests/pmsv-batch108-startup-state-display.test.cjs
      - name: Profile 390px mobile startup at normal and 4x CPU
        run: node tests/pmsv-batch111-snapshot-frequency.test.cjs
        timeout-minutes: 8
      - name: Save fingerprint frequency
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmsv-batch111-snapshot-frequency
          path: pmsv-batch111-snapshot-frequency.json
          if-no-files-found: ignore
          retention-days: 14
