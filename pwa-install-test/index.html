<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3155d9">
<title>PMSV Install Test</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="../public/icons/pmsv-family-192.png">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f0f3f9;color:#16233c}.top{background:#fff;padding:22px 24px;display:flex;align-items:center;gap:14px;border-bottom:1px solid #dce3ef}.top img{width:64px;height:64px;object-fit:contain}.top b{font-size:30px;display:block}.top span{font-size:18px}.wrap{max-width:720px;margin:0 auto;padding:28px}.card{background:white;border:1px solid #d7deea;border-radius:24px;padding:28px;box-shadow:0 6px 20px rgba(31,56,108,.06)}h1{font-size:32px;margin:0 0 12px}p{font-size:18px;line-height:1.5;color:#66758e}.actions{display:grid;gap:16px;margin-top:28px}button{appearance:none;border:0;border-radius:16px;padding:18px 20px;font-weight:800;font-size:19px;cursor:pointer}.install{background:#3155d9;color:#fff}.notify{background:#0d746d;color:#fff}.status{margin-top:20px;padding:14px 16px;background:#eef3ff;border-radius:14px;font-size:16px;color:#283b5b;min-height:52px}.small{font-size:14px;color:#7d8aa1;margin-top:18px}
</style>
</head>
<body>
<header class="top"><img src="../public/icons/pmsv-family-192.png" alt="PMSV"><div><b>PMSV</b><span>Food Safety &amp; Quality Forum</span></div></header>
<main class="wrap"><section class="card"><h1>Welcome to the Forum</h1><p>Food safety, quality and process excellence.</p><div class="actions"><button id="install" class="install">⬇ Install PMSV</button><button id="notify" class="notify">🔔 Allow notifications</button></div><div id="status" class="status">Ready.</div><div class="small">Temporary PMSV browser test. The live website is unchanged.</div></section><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px"><div class="card" style="padding:20px;font-weight:800">Updates/News</div><div class="card" style="padding:20px;font-weight:800">Audits</div><div class="card" style="padding:20px;font-weight:800">Blogs</div></div></main>
<script>
let deferredPrompt=null;
const installBtn=document.getElementById('install');
const notifyBtn=document.getElementById('notify');
const status=document.getElementById('status');
function say(s){status.textContent=s}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;say('Install is ready. Tap Install PMSV.');});
window.addEventListener('appinstalled',()=>{deferredPrompt=null;say('PMSV test app installed successfully.');});
async function waitForPrompt(){
 if(deferredPrompt)return deferredPrompt;
 return await new Promise(resolve=>{
   const h=e=>{e.preventDefault();deferredPrompt=e;window.removeEventListener('beforeinstallprompt',h);resolve(e)};
   window.addEventListener('beforeinstallprompt',h,{once:true});
   setTimeout(()=>{window.removeEventListener('beforeinstallprompt',h);resolve(deferredPrompt)},3500);
 });
}
installBtn.addEventListener('click',async()=>{
 say('Preparing install…');
 const p=await waitForPrompt();
 if(!p){say('Chrome has not made the native install prompt available yet.');return;}
 await p.prompt();
 const choice=await p.userChoice;
 say(choice.outcome==='accepted'?'Install accepted.':'Install cancelled.');
 if(choice.outcome==='accepted')deferredPrompt=null;
});
notifyBtn.addEventListener('click',async()=>{
 if(!('Notification' in window)){say('Notifications are not supported by this browser.');return;}
 const permission=await Notification.requestPermission();
 if(permission==='granted'){say('Notifications are ON for this test site.');notifyBtn.textContent='🔔 Notifications on';}
 else if(permission==='denied'){say('Notifications were blocked by the browser.');}
 else say('Notification permission was not granted.');
});
if('serviceWorker' in navigator){
 window.addEventListener('load',async()=>{
  try{await navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'});await navigator.serviceWorker.ready;}
  catch(e){say('Service worker could not start: '+e.message);}
 });
}
</script>
</body></html>
