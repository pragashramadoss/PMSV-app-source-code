<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>FSSAI Hygiene Rating | PMSV Audits</title><style>:root{--g:#0b6b53;--g2:#0f8a68;--ink:#15231f;--muted:#63736d;--bg:#f4f8f6;--line:#dce8e3}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:var(--bg);color:var(--ink)}header{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;padding:28px 18px 38px}.wrap{max-width:960px;margin:auto}.back{color:#fff;font-weight:750}h1{font-size:clamp(28px,5vw,44px);margin:24px 0 8px}main{padding:24px 16px}.panel{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;margin-top:-32px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.action{border:1px solid var(--line);border-radius:16px;background:#fff;padding:16px 15px;text-align:left;cursor:pointer;min-height:114px}.action:first-child{background:#effaf6}.action:last-child{background:#fff8ed}.ico{font-size:26px;display:block;margin-bottom:7px}.title{font-size:16px;font-weight:800}.desc{display:block;color:var(--muted);font-size:12px;line-height:1.35;margin-top:4px}.list{display:grid;gap:12px}.card{border:1px solid var(--line);border-radius:15px;padding:15px;background:#fff;display:flex;justify-content:space-between;gap:14px}.card.clickable{cursor:pointer;transition:.15s}.card.clickable:hover,.card.clickable:focus{border-color:#83b8a6;background:#f7fcfa;outline:none}.btn{border:0;border-radius:9px;padding:9px 12px;font-weight:750;background:var(--g);color:#fff}.hidden{display:none}.empty{color:var(--muted);padding:28px}@media(max-width:700px){.actions{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.action{min-height:104px;padding:13px 11px}.desc{display:none}.title{font-size:14px}.card{flex-direction:column}}</style><link rel="stylesheet" href="app-ui.css?v=34"><link rel="stylesheet" href="audit-fo </div><header><div class="wrap"><a class="back" href="index.html">← Audits</a><h1>FSSAI Hygiene Rating</h1><p>New audit, saved audits and NC follow-up.</p></div></header><main><div class="wrap"><section class="panel" id="landing"><div class="actions"><button class="action" onclick="location.href='hygiene-rating-new.html'"><span class="ico">＋</span><span class="title">New Audit</span><span class="desc">Select business type and start.</span></button><button class="action" id="savedBtn"><span class="ico">📋</span><span class="title">Saved Audits</span><span class="desc">Resume drafts or review completed audits.</span></button><button class="action" id="ncBtn"><span class="ico">✓</span><span class="title">NC Follow-up</span><span class="desc">Root cause, correction, corrective action and closure.</span></button></div></section><section class="panel hidden" id="panel"><button class="btn" onclick="home()">← Back</button><h2 id="heading"></h2><div class="list" id="list"></div></section></div></main><script>const KEY='pmsvHygieneRatingAudits',landing=document.getElementById('landing'),panel=document.getElementById('panel'),heading=document.getElementById('heading'),list=document.getElementById('list');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function get(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}function home(){panel.classList.add('hidden');landing.classList.remove('hidden')}function file(x){let t=(x.businessType||'').toLowerCase();return t.includes('sweet')?'hygiene-rating-sweet-shop.html':t.includes('meat')?'hygiene-rating-meat.html':'hygiene-rating.html'}function show(mode){landing.classList.add('hidden');panel.classList.remove('hidden');heading.textContent=mode==='nc'?'NC Follow-up':'Saved Audits';let a=get().sort((x,y)=>new Date(y.savedAt||0)-new Date(x.savedAt||0));if(mode==='nc')a=a.filter(x=>x.status==='Completed'&&(x.items||[]).some(i=>i.status==='NC'));list.innerHTML=a.length?a.map(x=>`<div class="card clickable" role="button" tabindex="0" onclick="openA('${esc(x.id)}','${esc(x.status)}','${mode}','${file(x)}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openA('${esc(x.id)}','${esc(x.status)}','${mode}','${file(x)}')}"><div><b>${esc(x.fbo||'Unnamed FBO')}</b><div>${esc(x.businessType||'Hygiene Rating')} · ${esc(x.date||'')}</div><div>${esc(x.percentage??0)}% · ${esc(x.rating||'')}</div><div>${esc(x.status||'')}</div></div></div>`).join(''):'<div class="empty">No matching audits yet.</div>'}function openA(id,status,mode,f){if(mode==='nc')location.href='hygiene-rating-nc-management.html?audit='+encodeURIComponent(id);else if(status==='Draft')location.href=f+'?draft='+encodeURIComponent(id);else location.href='hygiene-rating-report.html?audit='+encodeURIComponent(id)}savedBtn.onclick=()=>show('saved');ncBtn.onclick=()=>show('nc');</script><script>(function(){if(location.hostname!=='raw.githack.com')return;const marker='/public/audits/',i=location.pathname.indexOf(marker);if(i<0)return;const root=location.pathname.slice(0,i),preview=root+'/preview.html';addEventListener('DOMContentLoaded',()=>{document.querySelectorAll('.workspace-link').forEach(a=>{const t=a.textContent||'';if(t.includes('Updates'))a.href=preview+'?route=%2Fupdates';else if(t.includes('Blogs'))a.href=preview+'?route=%2Fblogs';else if(t.includes('Audits'))a.href=root+'/public/audits/index.html'});document.querySelectorAll('.pmsv-audit-home,.pmsv-audit-brand').forEach(a=>a.href=preview+'?route=%2F')})})();</script></body></html>
