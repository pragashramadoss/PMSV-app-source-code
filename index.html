<title>PMSV Food Safety & Quality Forum — Full Test</title>
<link rel="manifest" href="./manifest.webmanifest?v=9">
<script>
(function(){
  const root='/PMSV-app-source-code';
  window.PMSV={base:root,publicBase:root+'/public/',installPrompt:null};

  window.addEventListener('beforeinstallprompt',function(e){
    e.preventDefault();window.PMSV.installPrompt=e;window.dispatchEvent(new Event('pmsv-install-available'));
  });
  window.addEventListener('appinstalled',function(){window.PMSV.installPrompt=null;});

  const nativeFetch=window.fetch.bind(window);
  window.fetch=async function(input,init){
    try{
      const raw=typeof input==='string'?input:input.url;
      const u=new URL(raw,location.origin);
      if(u.pathname==='/api/news'||u.pathname===root+'/api/news'){
        const [r,b]=await Promise.all([
          nativeFetch(root+'/archive-seed.json',{cache:'no-store'}),
          nativeFetch(root+'/preview-blogs.json',{cache:'no-store'})
        ]);
        const news=(await r.json()).filter(n=>n.tab!=='blogs').concat(await b.json());
        return new Response(JSON.stringify({news}),{status:200,headers:{'Content-Type':'application/json'}});
      }
      if(u.pathname==='/api/updater'||u.pathname===root+'/api/updater'){
        return new Response(JSON.stringify({active:false,checks:[]}),{status:200,headers:{'Content-Type':'application/json'}});
      }
      if(u.pathname==='/api/push'||u.pathname===root+'/api/push'){
        const method=(init&&init.method||'GET').toUpperCase();
        if(method==='GET')return new Response(JSON.stringify({publicKey:'BIh1_YkviPWiUfhJDDA4rBUqvoJLxPAiMQsxrJBY15OFyQukIcm2fF-wi6gjKZ4PK0vLfgtOJR2ejl21bkpqxN8'}),{status:200,headers:{'Content-Type':'application/json'}});
        return new Response(JSON.stringify({enabled:method!=='DELETE'}),{status:200,headers:{'Content-Type':'application/json'}});
      }
    }catch(e){}
    return nativeFetch(input,init);
  };
  window.addEventListener('load',function(){
    if('serviceWorker' in navigator)navigator.serviceWorker.register(root+'/sw.js',{scope:root+'/',updateViaCache:'none'}).catch(()=>{});
  });
})();
</script>
